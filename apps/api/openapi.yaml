          in: path
          required: true
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Asignacion vigente del mismo operador; no se duplica.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsuncionRespuesta' }
        '201':
          description: Asignacion creada.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsuncionRespuesta' }
        '400':
          description: VALIDATION_ERROR, esta accion no admite cuerpo.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: FORBIDDEN (otro rol), FORBIDDEN_ORIGIN, SIN_AMBITO, ASIGNACION_REQUERIDA (falta asumir) o NO_PRINCIPAL.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/IncidenteNoDisponible' }
        '409':
          description: CASO_ASUMIDO, ESTADO_CAMBIADO (con estadoActual), TRANSICION_NO_PERMITIDA, INCIDENTE_CERRADO, DESTINO_NO_VALIDO o ASIGNACION_INACTIVA.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
