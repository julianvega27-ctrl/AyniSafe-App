openapi: 3.1.0
info:
  title: AyniSafe API - Acceso ciudadano, acceso institucional, perfil y contenido publico
  version: 0.4.0
  description: |
    Contrato del modulo Identidad: registro, inicio de sesion, consulta y cierre de sesion del
    ciudadano (entrega `registro-login-ciudadano`), mas recuperacion de contrasena y activacion de
    cuentas invitadas por correo (entrega `correo-recuperacion-activacion`), mas el perfil del propio
    ciudadano y el contenido publico (entrega `perfil-navegacion-movil`), mas el acceso institucional
    de administradores y operadores desde la web y sus paneles minimos (entrega
    `web-publica-acceso-institucional`).

    Reglas transversales:
    - Solo HTTPS en entornos compartidos. Credenciales unicamente en el cuerpo JSON.
    - La sesion viaja solo en `Authorization: Bearer <token>`; nunca en la URL.
    - Todas las respuestas de este contrato llevan `Cache-Control: no-store`.
    - Cuerpos JSON de hasta 8 KiB. Campos no declarados se rechazan con 400.
    - Limitacion de intentos (ventanas fijas de 15 minutos, configurables): registro 5 solicitudes por IP;
      acceso 30 por IP y 5 por combinacion correo+IP. Al superarlos se responde 429 con Retry-After.
    - La sesion dura 24 horas desde su creacion, sin renovacion.
    - Recuperacion y activacion: rutas publicas sin Bearer; la credencial es un token de un solo uso en el
      cuerpo (vence a los 30 min en recuperacion y a las 72 h en activacion). Cambiar la contrasena
      revoca todas las sesiones del usuario y no inicia sesion. No se verifica el correo.
    - Limites adicionales (configurables): recuperacion 10 por IP y 3 por correo+IP en 15 min, y 3 por
      correo por hora; consulta y consumo de tokens 20 por IP en 15 min. Tope diario global de
      solicitudes de recuperacion (por defecto 400, bajo la cuota de Gmail): al agotarse, 503 con Retry-After.
    - Perfil (`/perfil`): solo del titular de la sesion (Bearer); no hay ruta ni campo para elegir otro
      usuario. Admite editar `nombre`, `telefono` (opcional) y `compartirTelefono`; el correo es de solo lectura
      y cualquier otro campo (`correo`, `id`, `rol`, `estado`) se rechaza con 400. El telefono nunca aparece en
      `/auth/sesion`. La autorizacion de compartirlo solo se guarda: esta entrega no lo comparte con nadie.
    - Contenido publico (`/publico/contenido`): sin sesion, solo lectura (otros metodos reciben 405 con
      `Allow`), cache publica breve (no `no-store`). Cada seccion declara `aprobado` o `pendiente` y solo
      publica texto cuando esta aprobada; los contactos de emergencia estan vacios mientras no haya
      ninguno aprobado.
    - Acceso institucional (`/auth/institucional/*`): la sesion es el mismo token opaco de 24 h absolutas,
      sin renovacion, pero viaja SOLO en una cookie `HttpOnly; Secure; SameSite=Strict; Path=/` (sin `Domain`;
      con el prefijo `__Host-` bajo https) y nunca en el cuerpo. La web y la API comparten origen (reescritura
      de `/api/*`), por lo que la API no emite cabeceras CORS. Las rutas con cookie que cambian estado o inician
      sesion exigen `Origin` identico al origen web configurado y rechazan `Sec-Fetch-Site: cross-site`
      (403 `FORBIDDEN_ORIGIN`). Los paneles aceptan solo la cookie (ignoran `Authorization`) y las rutas
      ciudadanas solo Bearer: ninguna sesion vale en el otro canal. Un rol distinto del requerido recibe 403
      `FORBIDDEN`. Limites propios: 30 por IP y 5 por correo+IP en 15 min (`login_inst_*`).
    - No hay endpoints para crear operadores, administradores ni sedes en este contrato. La capacidad
      de invitacion es interna (se invoca dentro de la transaccion de quien crea la cuenta).
    - Las paginas de respaldo del enlace del correo (`GET /cuenta/restablecer`, `GET /cuenta/activar`) y
      `GET /.well-known/assetlinks.json` no son parte de esta API JSON; se describen en el README.
servers:
  - url: /api/v1
tags:
  - name: Acceso ciudadano
  - name: Recuperacion y activacion
  - name: Perfil
  - name: Contenido publico
  - name: Acceso institucional
  - name: Paneles
paths:
  /auth/ciudadanos/registro:
    post:
      tags: [Acceso ciudadano]
      operationId: registrarCiudadano
      summary: Crear una cuenta de ciudadano
      description: |
        Crea la cuenta con rol ciudadano y estado activo, fijados por el servidor. No inicia sesion
        ni exige verificar el correo. El correo se compara sin distinguir mayusculas.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistroSolicitud' }
      responses:
        '201':
          description: Cuenta creada. No incluye sesion, contrasena ni hash.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistroRespuesta' }
        '400': { $ref: '#/components/responses/ValidacionInvalida' }
        '409': { $ref: '#/components/responses/CorreoEnUso' }
        '413': { $ref: '#/components/responses/CuerpoDemasiadoGrande' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /auth/ciudadanos/sesiones:
    post:
      tags: [Acceso ciudadano]
      operationId: iniciarSesionCiudadano
      summary: Iniciar sesion con correo y contrasena
      description: |
        Emite una sesion opaca de 24 horas solo tras validar credenciales y persistirla. Correo
        desconocido, contrasena incorrecta, cuenta suspendida o no ciudadana producen el mismo 401.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginSolicitud' }
      responses:
        '200':
          description: Sesion iniciada.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginRespuesta' }
        '400': { $ref: '#/components/responses/ValidacionInvalida' }
        '401': { $ref: '#/components/responses/CredencialesInvalidas' }
        '413': { $ref: '#/components/responses/CuerpoDemasiadoGrande' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /auth/sesion:
    get:
      tags: [Acceso ciudadano]
      operationId: consultarSesion
      summary: Consultar la sesion actual
      description: |
        Devuelve unicamente la identidad del propietario de la sesion presentada. No acepta
        parametros para elegir otro usuario.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sesion vigente.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionRespuesta' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
    delete:
      tags: [Acceso ciudadano]
      operationId: cerrarSesion
      summary: Cerrar la sesion actual
      description: |
        Revoca solo la sesion presentada. Es idempotente: token ausente, desconocido o ya revocado
        tambien responde 204 sin afectar otras sesiones.
      security:
        - bearerAuth: []
        - {}
      responses:
        '204':
          description: Sesion revocada o inexistente.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /auth/recuperaciones:
    post:
      tags: [Recuperacion y activacion]
      operationId: solicitarRecuperacion
      summary: Solicitar el enlace para restablecer la contrasena
      description: |
        Respuesta uniforme: es la misma 202 exista o no la cuenta, este suspendida, pendiente o no
        sea ciudadana. Solo una cuenta ciudadana activa recibe un correo, que se envia despues de
        responder (el estado del proveedor no cambia la respuesta). Un 503 con Retry-After indica
        que se agoto el tope diario global de correos, con independencia de la cuenta.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecuperacionSolicitud' }
      responses:
        '202':
          description: Solicitud recibida. No confirma que exista una cuenta.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecuperacionRespuesta' }
        '400': { $ref: '#/components/responses/ValidacionInvalida' }
        '413': { $ref: '#/components/responses/CuerpoDemasiadoGrande' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponibleConCuota' }
  /auth/tokens/consulta:
    post:
      tags: [Recuperacion y activacion]
      operationId: consultarToken
      summary: Consultar el estado de un enlace sin consumirlo
      description: |
        Indica si el token es vigente y para que sirve. No lo modifica. Se usa para mostrar las
        pantallas de enlace usado o vencido antes de pedir una contrasena. El token viaja solo en
        el cuerpo, nunca en la URL.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenSolicitud' }
      responses:
        '200':
          description: Token vigente.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsultaTokenRespuesta' }
        '400': { $ref: '#/components/responses/ValidacionInvalida' }
        '404': { $ref: '#/components/responses/TokenInvalido' }
        '410': { $ref: '#/components/responses/TokenNoVigente' }
        '413': { $ref: '#/components/responses/CuerpoDemasiadoGrande' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /auth/contrasena/restablecer:
    post:
      tags: [Recuperacion y activacion]
      operationId: restablecerContrasena
      summary: Cambiar la contrasena con un token de recuperacion
      description: |
        Consumo atomico y de un solo uso: de varias solicitudes simultaneas con el mismo token solo
        una responde 204. En la misma operacion se invalidan los demas tokens de la cuenta y se
        revocan todas sus sesiones. No inicia sesion ni devuelve token de sesion. Un 400 por
        contrasena no admitida no consume el token. Un token de otro proposito, o de una cuenta que
        ya no puede usarlo, es 404 sin distinguir la causa.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsumoTokenSolicitud' }
      responses:
        '204':
          description: Contrasena cambiada y sesiones revocadas. Sin cuerpo.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '400': { $ref: '#/components/responses/ValidacionInvalida' }
        '404': { $ref: '#/components/responses/TokenInvalido' }
        '410': { $ref: '#/components/responses/TokenNoVigente' }
        '413': { $ref: '#/components/responses/CuerpoDemasiadoGrande' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /auth/activaciones:
    post:
      tags: [Recuperacion y activacion]
      operationId: activarCuenta
      summary: Activar una cuenta invitada y definir su contrasena
      description: |
        Para cuentas en estado `pendiente_activacion` invitadas por otra entrega (por ejemplo, el
        alta de operadores). Deja la cuenta activa con la contrasena elegida y no crea sesion. Esta
        entrega no expone ninguna ruta que cree operadores.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsumoTokenSolicitud' }
      responses:
        '204':
          description: Cuenta activada. Sin cuerpo y sin sesion.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '400': { $ref: '#/components/responses/ValidacionInvalida' }
        '404': { $ref: '#/components/responses/TokenInvalido' }
        '410': { $ref: '#/components/responses/TokenNoVigente' }
        '413': { $ref: '#/components/responses/CuerpoDemasiadoGrande' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /perfil:
    get:
      tags: [Perfil]
      operationId: obtenerPerfil
      summary: Consultar el perfil propio
      description: |
        Devuelve unicamente el perfil del titular de la sesion presentada. No acepta parametros para
        elegir otro usuario. Incluye el telefono (o nulo) y si autoriza compartirlo.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil del titular.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Perfil' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
    patch:
      tags: [Perfil]
      operationId: actualizarPerfil
      summary: Editar nombre, telefono y autorizacion de compartirlo
      description: |
        Aplica solo los campos enviados (al menos uno). El correo no es editable: enviar `correo`, `id`,
        `rol`, `estado` u otro campo no declarado devuelve 400. El telefono se normaliza (sin espacios,
        guiones, puntos ni parentesis; 7 a 15 digitos con `+` inicial opcional); `null` o texto vacio lo borra.
        La autorizacion exige telefono, se revoca al borrarlo o cambiarlo (salvo que la misma solicitud la
        otorgue) y revocarla no borra el numero. Ediciones simultaneas se serializan (ultima escritura).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PerfilCambios' }
      responses:
        '200':
          description: Perfil actualizado.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Perfil' }
        '400': { $ref: '#/components/responses/ValidacionInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '413': { $ref: '#/components/responses/CuerpoDemasiadoGrande' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /auth/institucional/sesiones:
    post:
      tags: [Acceso institucional]
      operationId: iniciarSesionInstitucional
      summary: Iniciar sesion de administrador u operador
      description: |
        Solo cuentas activas de rol administrador u operador. Ciudadano, cuenta suspendida, pendiente de
        activacion, correo desconocido y contrasena incorrecta producen el mismo 401. La sesion se
        entrega en una cookie HttpOnly; el cuerpo no incluye el token. Exige `Origin` igual al origen web.
      security: []
      parameters:
        - $ref: '#/components/parameters/OrigenWeb'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginSolicitud' }
      responses:
        '200':
          description: Sesion iniciada.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Set-Cookie: { $ref: '#/components/headers/SetCookieSesion' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionInstitucionalRespuesta' }
        '400': { $ref: '#/components/responses/ValidacionInvalida' }
        '401': { $ref: '#/components/responses/CredencialesInvalidas' }
        '403': { $ref: '#/components/responses/OrigenNoPermitido' }
        '413': { $ref: '#/components/responses/CuerpoDemasiadoGrande' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /auth/institucional/sesion:
    get:
      tags: [Acceso institucional]
      operationId: consultarSesionInstitucional
      summary: Consultar la sesion institucional (restaurar al refrescar)
      description: |
        Identidad y vencimiento de la sesion de la cookie. Cada peticion revalida el estado y el rol de la
        cuenta: una cuenta suspendida o que ya no es institucional recibe 401 aunque la sesion no haya vencido.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Sesion vigente.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionInstitucionalRespuesta' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
    delete:
      tags: [Acceso institucional]
      operationId: cerrarSesionInstitucional
      summary: Cerrar la sesion institucional
      description: |
        Revoca la sesion de la cookie y la borra. Idempotente: sin cookie, desconocida o ya revocada tambien
        responde 204. Exige `Origin` igual al origen web; si la solicitud declara contenido, debe ser JSON.
      security:
        - cookieAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/OrigenWeb'
      responses:
        '204':
          description: Sesion revocada o inexistente; la cookie queda borrada.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Set-Cookie: { $ref: '#/components/headers/SetCookieBorrada' }
        '403': { $ref: '#/components/responses/OrigenNoPermitido' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /administrador/panel:
    get:
      tags: [Paneles]
      operationId: obtenerPanelAdministrador
      summary: Panel minimo del administrador
      description: |
        Solo administradores activos. Devuelve la identidad y las secciones del panel segun la guia de UI,
        todas `disponible: false` mientras no existan. Sin datos operativos.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Panel del administrador.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PanelRespuesta' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RolNoPermitido' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /operador/panel:
    get:
      tags: [Paneles]
      operationId: obtenerPanelOperador
      summary: Panel minimo del operador
      description: |
        Solo operadores activos. Devuelve la identidad y las secciones del panel (Reportes, Mapa, Indicadores),
        todas `disponible: false` mientras no existan. Sin datos operativos.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Panel del operador.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PanelRespuesta' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RolNoPermitido' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /publico/contenido:
    get:
      tags: [Contenido publico]
      operationId: obtenerContenidoPublico
      summary: Contenido publico versionado (sin sesion)
      description: |
        Finalidad y funcionamiento, desarrolladores, privacidad y contactos de emergencia. Es el mismo
        contenido para todos. Una seccion `pendiente` no lleva texto. No incluye datos de cuentas. Los
        metodos distintos de GET responden 405 con `Allow`.
      security: []
      responses:
        '200':
          description: Contenido vigente.
          headers:
            Cache-Control:
              description: Cache publica breve.
              schema: { type: string, const: "public, max-age=300" }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContenidoPublico' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token opaco de sesion (32 bytes aleatorios en base64url).
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-ayni_inst
      description: |
        Sesion institucional (el mismo token opaco). Cookie HttpOnly, Secure, SameSite=Strict, Path=/. Bajo http
        local el nombre es `ayni_inst`, sin prefijo ni Secure. Solo para administradores y operadores.
  parameters:
    OrigenWeb:
      name: Origin
      in: header
      required: true
      description: Debe ser identico al origen web configurado. Un origen ajeno o ausente recibe 403.
      schema: { type: string }
  headers:
    NoStore:
      description: Las respuestas de autenticacion no se almacenan en cache.
      schema: { type: string, const: no-store }
    SetCookieSesion:
      description: Cookie de sesion institucional (HttpOnly, Secure, SameSite=Strict, Path=/, Max-Age hasta el vencimiento absoluto).
      schema: { type: string }
    SetCookieBorrada:
      description: La misma cookie con Max-Age=0 para borrarla.
      schema: { type: string }
    RetryAfter:
      description: Segundos de espera antes de reintentar (el mayor plazo restante aplicable).
      schema: { type: integer, minimum: 1 }
    RetryAfterOpcional:
      description: Segundos hasta que se libere la cuota diaria. Solo cuando el 503 es por cuota agotada.
      required: false
      schema: { type: integer, minimum: 1 }
  schemas:
    RegistroSolicitud:
      type: object
      additionalProperties: false
      required: [nombre, correo, contrasena]
      example: { nombre: "Rosa Quispe", correo: "rosa@ejemplo.com", contrasena: "contraseña de ejemplo 123" }
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
          description: 1 a 100 puntos de codigo Unicode tras recortar extremos.
        correo:
          type: string
          maxLength: 254
          description: |
            Sintaxis valida, hasta 254 caracteres tras recortar extremos. Se guarda en minusculas;
            no se eliminan puntos ni sufijos `+`.
        contrasena:
          type: string
          minLength: 15
          maxLength: 128
          writeOnly: true
          description: |
            15 a 128 puntos de codigo Unicode, con espacios, sin reglas de composicion. No se
            recorta, normaliza ni trunca.
    LoginSolicitud:
      type: object
      additionalProperties: false
      required: [correo, contrasena]
      example: { correo: "rosa@ejemplo.com", contrasena: "contraseña de ejemplo 123" }
      properties:
        correo:
          type: string
          maxLength: 254
        contrasena:
          type: string
          minLength: 15
          maxLength: 128
          writeOnly: true
    UsuarioPublico:
      type: object
      additionalProperties: false
      required: [id, nombre, correo, rol]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        correo: { type: string }
        rol: { type: string, const: ciudadano }
    RegistroRespuesta:
      type: object
      additionalProperties: false
      required: [usuario]
      example: { usuario: { id: "5482bbd9-ef53-4049-a095-19a9d0144eeb", nombre: "Rosa Quispe", correo: "rosa@ejemplo.com", rol: ciudadano } }
      properties:
        usuario: { $ref: '#/components/schemas/UsuarioPublico' }
    LoginRespuesta:
      type: object
      additionalProperties: false
      required: [token, expiresAt, usuario]
      example: { token: "Zm9vYmFyLWVqZW1wbG8tZGUtdG9rZW4tb3BhY28tMDAwMDA", expiresAt: "2026-11-22T13:48:50.555Z", usuario: { id: "5482bbd9-ef53-4049-a095-19a9d0144eeb", nombre: "Rosa Quispe", correo: "rosa@ejemplo.com", rol: ciudadano } }
      properties:
        token: { type: string }
        expiresAt:
          type: string
          format: date-time
          description: Vencimiento absoluto, 24 horas despues de la creacion. Sin renovacion.
        usuario: { $ref: '#/components/schemas/UsuarioPublico' }
    SesionRespuesta:
      type: object
      additionalProperties: false
      required: [usuario, expiresAt]
      example: { usuario: { id: "5482bbd9-ef53-4049-a095-19a9d0144eeb", nombre: "Rosa Quispe", correo: "rosa@ejemplo.com", rol: ciudadano }, expiresAt: "2026-11-22T13:48:50.555Z" }
      properties:
        usuario: { $ref: '#/components/schemas/UsuarioPublico' }
        expiresAt: { type: string, format: date-time }
    UsuarioInstitucional:
      type: object
      additionalProperties: false
      required: [id, nombre, correo, rol]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        correo: { type: string }
        rol: { type: string, enum: [administrador, operador] }
    SesionInstitucionalRespuesta:
      type: object
      additionalProperties: false
      required: [usuario, expiresAt]
      description: "Sin token, la sesion viaja solo en la cookie."
      example: { usuario: { id: "5482bbd9-ef53-4049-a095-19a9d0144eeb", nombre: "Ana Torres", correo: "ana@ejemplo.com", rol: administrador }, expiresAt: "2026-11-22T13:48:50.555Z" }
      properties:
        usuario: { $ref: '#/components/schemas/UsuarioInstitucional' }
        expiresAt: { type: string, format: date-time }
    SeccionPanel:
      type: object
      additionalProperties: false
      required: [id, titulo, disponible]
      properties:
        id: { type: string }
        titulo: { type: string }
        disponible:
          type: boolean
          description: Falso mientras la capacidad no exista; el cliente la declara aun no disponible.
    PanelRespuesta:
      type: object
      additionalProperties: false
      required: [usuario, secciones]
      properties:
        usuario: { $ref: '#/components/schemas/UsuarioInstitucional' }
        secciones:
          type: array
          items: { $ref: '#/components/schemas/SeccionPanel' }
    RecuperacionSolicitud:
      type: object
      additionalProperties: false
      required: [correo]
      example: { correo: "rosa@ejemplo.com" }
      properties:
        correo:
          type: string
          maxLength: 254
          description: Misma validacion y normalizacion que el registro y el acceso.
    RecuperacionRespuesta:
      type: object
      additionalProperties: false
      required: [estado]
      example: { estado: solicitud_recibida }
      properties:
        estado: { type: string, const: solicitud_recibida }
    TokenSolicitud:
      type: object
      additionalProperties: false
      required: [token]
      example: { token: "Zm9vYmFyLWVqZW1wbG8tZGUtdG9rZW4tb3BhY28tMDAwMDA" }
      properties:
        token:
          type: string
          minLength: 1
          description: Token opaco del enlace o codigo pegado a mano (43 caracteres base64url).
    ConsumoTokenSolicitud:
      type: object
      additionalProperties: false
      required: [token, contrasena]
      example: { token: "Zm9vYmFyLWVqZW1wbG8tZGUtdG9rZW4tb3BhY28tMDAwMDA", contrasena: "una contraseña nueva de ejemplo" }
      properties:
        token: { type: string, minLength: 1 }
        contrasena:
          type: string
          minLength: 15
          maxLength: 128
          writeOnly: true
          description: "Misma politica que el registro: 15 a 128 puntos de codigo, sin recortar ni normalizar."
    ConsultaTokenRespuesta:
      type: object
      additionalProperties: false
      required: [proposito, expiresAt]
      example: { proposito: recuperacion, expiresAt: "2026-11-21T12:30:00.000Z" }
      properties:
        proposito: { type: string, enum: [recuperacion, activacion] }
        expiresAt: { type: string, format: date-time }
    Perfil:
      type: object
      additionalProperties: false
      required: [id, nombre, correo, telefono, compartirTelefono]
      example: { id: "5482bbd9-ef53-4049-a095-19a9d0144eeb", nombre: "Rosa Quispe", correo: "rosa@ejemplo.com", telefono: "+51987654321", compartirTelefono: false }
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        correo: { type: string, description: "Solo lectura. No se presenta como verificado." }
        telefono:
          type: [string, 'null']
          description: Normalizado; nulo si no se registro.
        compartirTelefono:
          type: boolean
          description: Autorizacion vigente para compartir el telefono. Por ahora solo se guarda; nadie lo recibe.
    PerfilCambios:
      type: object
      additionalProperties: false
      minProperties: 1
      example: { nombre: "Rosa Quispe", telefono: "+51 987-654-321", compartirTelefono: true }
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
          description: 1 a 100 puntos de codigo Unicode tras recortar extremos.
        telefono:
          type: [string, 'null']
          description: 7 a 15 digitos con `+` inicial opcional (se admiten espacios, guiones, puntos y parentesis). `null` o vacio lo borra.
        compartirTelefono:
          type: boolean
          description: Requiere un telefono registrado o enviado en la misma solicitud.
    EstadoAprobacion:
      type: string
      enum: [aprobado, pendiente]
    ContenidoPublico:
      type: object
      additionalProperties: false
      required: [version, actualizadoAt, app, piloto, desarrolladores, privacidad, contactos]
      properties:
        version: { type: integer, minimum: 1 }
        actualizadoAt: { type: string, format: date }
        app:
          type: object
          additionalProperties: false
          required: [estado]
          properties:
            estado: { $ref: '#/components/schemas/EstadoAprobacion' }
            finalidad: { type: string }
            funcionamiento: { type: string }
        piloto:
          type: object
          description: Alcance del piloto. Pendiente y sin texto hasta que el equipo lo apruebe.
          additionalProperties: false
          required: [estado]
          properties:
            estado: { $ref: '#/components/schemas/EstadoAprobacion' }
            texto: { type: string }
        desarrolladores:
          type: object
          additionalProperties: false
          required: [estado]
          properties:
            estado: { $ref: '#/components/schemas/EstadoAprobacion' }
            personas:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [nombre, rol]
                properties:
                  nombre: { type: string }
                  rol: { type: string }
        privacidad:
          type: object
          additionalProperties: false
          required: [estado]
          properties:
            estado: { $ref: '#/components/schemas/EstadoAprobacion' }
            secciones:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [titulo, texto]
                properties:
                  titulo: { type: string }
                  texto: { type: string }
        contactos:
          type: object
          additionalProperties: false
          required: [estado, items]
          properties:
            estado: { $ref: '#/components/schemas/EstadoAprobacion' }
            items:
              type: array
              description: Vacia mientras no haya contactos aprobados.
              items:
                type: object
                additionalProperties: false
                required: [institucion, numero, cobertura, fuente, verificadoAt]
                properties:
                  institucion: { type: string }
                  numero: { type: string }
                  cobertura: { type: string }
                  fuente: { type: string }
                  verificadoAt: { type: string, format: date }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - EMAIL_IN_USE
                - INVALID_CREDENTIALS
                - UNAUTHENTICATED
                - FORBIDDEN_ORIGIN
                - FORBIDDEN
                - TOKEN_INVALID
                - TOKEN_USED
                - TOKEN_EXPIRED
                - PAYLOAD_TOO_LARGE
                - UNSUPPORTED_MEDIA_TYPE
                - RATE_LIMITED
                - SERVICE_UNAVAILABLE
                - INTERNAL_ERROR
            message: { type: string }
            fields:
              type: object
              description: Mensaje por campo. Nunca contiene el valor enviado.
              additionalProperties: { type: string }
            requestId:
              type: string
              description: Identificador aleatorio de la solicitud; no contiene datos de cuenta.
  responses:
    OrigenNoPermitido:
      description: |
        La solicitud no viene del origen web configurado (falta `Origin`, es otro, o `Sec-Fetch-Site` es
        `cross-site`). No toca cookies ni sesiones y se evalua antes de limitar intentos.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: FORBIDDEN_ORIGIN, message: "La solicitud no proviene de un origen permitido.", requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } }
    RolNoPermitido:
      description: Sesion institucional valida de otro rol. No devuelve datos del panel.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: FORBIDDEN, message: "Tu cuenta no tiene permiso para este recurso.", requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } }
    ValidacionInvalida:
      description: Campos ausentes, tipos incorrectos, valores fuera de regla o campos no admitidos.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: VALIDATION_ERROR, message: "Revisa los datos ingresados.", fields: { correo: "Ingresa un correo válido." }, requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } }
    CorreoEnUso:
      description: El correo normalizado ya esta registrado. No revela nombre, rol ni estado.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: EMAIL_IN_USE, message: "Este correo ya está registrado. Inicia sesión.", requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } }
    CredencialesInvalidas:
      description: Correo o contrasena incorrectos (mismo mensaje para todas las causas).
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: INVALID_CREDENTIALS, message: "Correo o contraseña incorrectos.", requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } }
    NoAutenticado:
      description: Token ausente, invalido, vencido, revocado o de cuenta no habilitada.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: UNAUTHENTICATED, message: "Tu sesión no es válida. Inicia sesión de nuevo.", requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } }
    CuerpoDemasiadoGrande:
      description: El cuerpo JSON supera 8 KiB.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: PAYLOAD_TOO_LARGE, message: "La solicitud es demasiado grande.", requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } }
    TipoNoSoportado:
      description: Content-Type distinto de application/json.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: UNSUPPORTED_MEDIA_TYPE, message: "El contenido debe enviarse como application/json en UTF-8.", requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } }
    LimiteExcedido:
      description: Limite de intentos superado. No se crea cuenta ni sesion.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: RATE_LIMITED, message: "Demasiados intentos. Espera antes de volver a intentar.", requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } }
    ServicioNoDisponible:
      description: Base de datos, hash o dependencia interna no disponible. Reintento manual.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: SERVICE_UNAVAILABLE, message: "El servicio no está disponible por ahora. Inténtalo de nuevo en unos minutos.", requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } }
    ErrorInterno:
      description: Error inesperado. Mensaje generico y requestId, sin detalles internos.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: INTERNAL_ERROR, message: "Ocurrió un error inesperado. Si persiste, indica el código de la solicitud.", requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } }
    TokenInvalido:
      description: Token desconocido, alterado, de otro proposito o de una cuenta que ya no puede usarlo.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: TOKEN_INVALID, message: "El enlace o el código no es válido.", requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } }
    TokenNoVigente:
      description: |
        El token ya se uso o fue reemplazado por uno mas reciente (`TOKEN_USED`), o su plazo termino
        (`TOKEN_EXPIRED`). La app ofrece solicitar otro enlace.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            usado: { value: { error: { code: TOKEN_USED, message: "Este enlace ya se usó o fue reemplazado por uno más reciente.", requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } } }
            vencido: { value: { error: { code: TOKEN_EXPIRED, message: "Este enlace venció. Solicita uno nuevo.", requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } } }
    ServicioNoDisponibleConCuota:
      description: |
        Dependencia interna no disponible, o tope diario global de correos agotado. En el segundo caso
        incluye Retry-After; la respuesta es la misma para toda solicitud valida, exista o no la cuenta.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Retry-After: { $ref: '#/components/headers/RetryAfterOpcional' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: SERVICE_UNAVAILABLE, message: "No podemos enviar más correos por hoy. Inténtalo de nuevo más tarde.", requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } }
