    post:
      tags: [Organizacion]
      operationId: crearSedeConOperador
      summary: Crear sede con su operador inicial (alta atomica)
      description: |
        Sede, cuenta operador `pendiente_activacion` sin contrasena, pertenencia e invitacion se confirman en una
        sola transaccion o no queda nada (RF29, EQ-12). El correo de activacion se entrega despues del commit. La
        sede nace deshabilitada para atencion. Reintentar una alta ya confirmada responde 409 `SEDE_EXISTENTE`
