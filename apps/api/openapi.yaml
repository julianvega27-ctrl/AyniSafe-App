        '403': { $ref: '#/components/responses/RolNoPermitido' }
        '404': { $ref: '#/components/responses/RecursoNoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
    post:
      tags: [Organizacion]
      operationId: agregarOperador
      summary: Agregar un operador a una sede
      description: |
        Crea la cuenta pendiente de activacion, su pertenencia a esta unica sede y la invitacion en la misma
        transaccion. Sin contrasena: el titular la elige con el enlace de activacion.
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, description: 'Identificador (UUID) de la sede. Un valor que no es UUID o no existe responde 404.', schema: { type: string } }
        - $ref: '#/components/parameters/OrigenWeb'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperadorAlta' }
      responses:
        '201':
          description: Operador creado e invitado.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperadorRespuesta' }
        '400': { $ref: '#/components/responses/ValidacionInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ProhibidoOrganizacion' }
        '404': { $ref: '#/components/responses/RecursoNoEncontrado' }
        '409': { $ref: '#/components/responses/ConflictoOrganizacion' }
        '413': { $ref: '#/components/responses/CuerpoDemasiadoGrande' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /administrador/organizacion/operadores/{id}:
    patch:
      tags: [Organizacion]
      operationId: cambiarEstadoOperador
      summary: Suspender o reactivar un operador
      description: |
        Suspender revoca sus sesiones y sus enlaces de activacion sin usar en la misma transaccion; dejar sin
        operador activo una sede habilitada responde 409 `ULTIMO_OPERADOR_ACTIVO`. Reactivar devuelve la cuenta a
        activa o, si nunca se activo, a pendiente (hace falta reenviar la invitacion). No borra filas.
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, description: 'Identificador (UUID) del operador. Una cuenta que no es operador con sede responde 404.', schema: { type: string } }
        - $ref: '#/components/parameters/OrigenWeb'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperadorCambio' }
      responses:
        '200':
          description: Estado del operador.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperadorRespuesta' }
        '400': { $ref: '#/components/responses/ValidacionInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ProhibidoOrganizacion' }
        '404': { $ref: '#/components/responses/RecursoNoEncontrado' }
        '409': { $ref: '#/components/responses/ConflictoOrganizacion' }
        '413': { $ref: '#/components/responses/CuerpoDemasiadoGrande' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /administrador/organizacion/operadores/{id}/invitacion:
    post:
      tags: [Organizacion]
      operationId: reenviarInvitacion
      summary: Reenviar la invitacion de un operador pendiente
      description: |
        Invalida los enlaces de activacion anteriores sin usar y encola un correo nuevo (sin duplicar un envio
        activo). Una cuenta activa o suspendida responde 409 `INVITACION_NO_APLICABLE`. Nunca devuelve el enlace.
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, description: 'Identificador (UUID) del operador. Una cuenta que no es operador con sede responde 404.', schema: { type: string } }
        - $ref: '#/components/parameters/OrigenWeb'
      responses:
        '202':
          description: Invitacion encolada.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitacionRespuesta' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ProhibidoOrganizacion' }
        '404': { $ref: '#/components/responses/RecursoNoEncontrado' }
        '409': { $ref: '#/components/responses/ConflictoOrganizacion' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /operador/ambito:
    get:
      tags: [Paneles]
      operationId: consultarAmbitoOperador
      summary: Ambito del propio operador
      description: |
        Institucion, sede, distritos de cobertura, categorias y habilitacion de la sede del titular de la sesion.
        `ambito: null` si la sede o la institucion no estan activas. Sin datos de otras sedes ni operadores.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Ambito vigente.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AmbitoRespuesta' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RolNoPermitido' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /publico/contenido:
    get:
      tags: [Contenido publico]
      operationId: obtenerContenidoPublico
      summary: Contenido publico versionado (sin sesion)
      description: |
        Finalidad y funcionamiento, desarrolladores, privacidad y contactos de emergencia. Es el mismo
        contenido para todos. Una seccion `pendiente` no lleva texto. No incluye datos de cuentas. Los
        metodos distintos de GET responden 405 con `Allow`.
      security: []
      responses:
        '200':
          description: Contenido vigente.
          headers:
            Cache-Control:
              description: Cache publica breve.
              schema: { type: string, const: "public, max-age=300" }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContenidoPublico' }
  /publico/territorio/distritos:
    get:
      tags: [Territorio]
      operationId: listarDistritosPiloto
      summary: Cinco distritos y estado del catálogo territorial
      description: Sin sesión; no admite parámetros. Sin cartografía activa entrega versión y UBIGEO nulos.
      security: []
      responses:
        '200':
          description: Catálogo disponible o pendiente.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogoTerritorial' }
              example: { estado: pendiente, version: null, distritos: [{ id: DIS-01, nombre: Ayacucho, ubigeo: null }, { id: DIS-02, nombre: San Juan Bautista, ubigeo: null }, { id: DIS-03, nombre: Carmen Alto, ubigeo: null }, { id: DIS-04, nombre: Jesús Nazareno, ubigeo: null }, { id: DIS-05, nombre: Andrés Avelino Cáceres Dorregaray, ubigeo: null }] }
        '422': { $ref: '#/components/responses/ErrorConsultaTerritorial' }
        '503': { $ref: '#/components/responses/ErrorConsultaTerritorial' }
  /publico/territorio/limites:
    get:
      tags: [Territorio]
      operationId: obtenerLimitesDistritales
      summary: Cartografía de referencia de una única versión
      description: Sin versión explícita usa la activa; sin activa responde 503. Una versión explícita ausente recibe 404 y nunca se sustituye por la activa. Admite HEAD.
      security: []
      parameters:
        - in: query
          name: version
          required: false
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '200':
          description: FeatureCollection WGS84 de cinco distritos. No representa delimitación legal ni cobertura institucional.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LimitesTerritoriales' }
        '404': { $ref: '#/components/responses/ErrorConsultaTerritorial' }
        '422': { $ref: '#/components/responses/ErrorConsultaTerritorial' }
        '503': { $ref: '#/components/responses/ErrorConsultaTerritorial' }
  /publico/territorio/resolver:
    post:
      tags: [Territorio]
      operationId: resolverDistritoDelPunto
      summary: Resolver un punto sin guardar su ubicación
      description: |
        Solo interiores inequívocos. Borde tiene precedencia sobre solapamiento; huecos se excluyen.
        Fuera del área es un resultado pendiente, distinto de cartografía no disponible. No recibe
        coordenadas por query ni concede permisos. Cuota 60/IP/minuto por instancia; 4 KiB JSON.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PuntoTerritorial' }
            example: { latitud: -13.158, longitud: -74.224 }
      responses:
        '200':
          description: Resultado con la versión efectivamente evaluada.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoTerritorial' }
              example: { estado: pendiente, distrito: null, motivo: fuera_area, version: '5cb61fbee9a0e8b24fc33c3ddc346864479b9b01d685901c36dafca130fe8067' }
        '400': { $ref: '#/components/responses/ErrorConsultaTerritorial' }
        '404': { $ref: '#/components/responses/ErrorConsultaTerritorial' }
        '413': { $ref: '#/components/responses/ErrorConsultaTerritorial' }
        '415': { $ref: '#/components/responses/ErrorConsultaTerritorial' }
        '422': { $ref: '#/components/responses/ErrorConsultaTerritorial' }
        '429':
          description: Cuota por IP o capacidad de claves agotada; no se clasifica el punto.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorTerritorialRespuesta' }
        '503': { $ref: '#/components/responses/ErrorConsultaTerritorial' }
  /publico/categorias:
    get:
      tags: [Categorias]
      operationId: listarCategorias
      summary: Catalogo de las 16 categorias (sin sesion)
      description: |
        Mismo cuerpo para anonimos y para los tres roles. Solo identificador estable, nombre, orden y estado
        activo; sin prioridades, reglas ni destinatarios. Sin parametros. Otros metodos reciben 405 con `Allow`.
      security: []
      responses:
        '200':
          description: Catalogo vigente.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogoCategorias' }
        '400': { $ref: '#/components/responses/ErrorCatalogo' }
        '503': { $ref: '#/components/responses/ErrorCatalogo' }
  /incidentes:
    post:
      tags: [Incidentes]
      operationId: registrarIncidente
      summary: Registrar un incidente como invitado o con cuenta ciudadana
      description: |
        Cada envio confirmado crea un incidente unico en estado REGISTRADO (P4.1). Sin `Authorization` se
        registra como invitado: el telefono de contacto es obligatorio y la respuesta incluye una unica vez
        el codigo secreto de seguimiento (el servidor solo guarda su huella). Con `Authorization: Bearer` de
        un ciudadano activo, el autor sale de la sesion y no se admite telefono. Un `Authorization` invalido
        responde 401 (no se degrada a invitado) y una sesion institucional por cookie responde 403.

        El backend resuelve el distrito desde el punto con la version territorial activa; frontera,
        solapamiento o punto fuera del area quedan pendientes con su motivo, y sin cartografia activa se
        registra igual con motivo `sin_cartografia`. `Idempotency-Key` (UUID) es obligatoria: repetirla con el
        mismo contenido devuelve 200 con el mismo incidente (el invitado recibe un codigo nuevo que invalida el
        anterior); con otro contenido, 409. El registro no espera enrutamiento ni avisos: se publica el evento
        `IncidenteRegistrado` en la misma transaccion. Invitados: 10 envios por IP y hora (configurable); una
        repeticion no consume el limite. JSON de hasta 8 KiB; campos no declarados reciben 400.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnvioIncidente' }
            examples:
              invitado:
                value:
                  categoriaId: pelea
                  descripcion: Pelea entre varias personas frente al mercado
                  ocurrencia: { modo: ahora, instante: '2026-11-26T10:00:00-05:00' }
                  punto: { latitud: -13.1588, longitud: -74.2232, origen: gps, precisionM: 12 }
                  heridos: no_se
                  telefonoContacto: '+51987654321'
      responses:
        '201':
          description: Incidente registrado. El codigo de seguimiento solo aparece en envios de invitado.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComprobanteIncidente' }
              example:
                referencia: INC-7K3M9-Q2TXA
                estado: REGISTRADO
                recibidoEn: '2026-11-26T15:00:01.123Z'
                modalidad: invitado
                territorio: { estado: resuelto, distrito: { id: DIS-01, nombre: Ayacucho } }
                codigoSeguimiento: 7K3M-9Q2T-XAB4-CD5E
        '200':
          description: Repeticion idempotente del mismo envio. Mismo incidente; el invitado recibe un codigo nuevo.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComprobanteIncidente' }
        '400':
          description: |
            `VALIDATION_ERROR` (campos ausentes, invalidos, reservados o no aplicables a la categoria o modalidad;
            JSON mal formado) o `IDEMPOTENCY_KEY_REQUIRED` (cabecera ausente o que no es un UUID).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: Sesion institucional (operador o administrador) vigente por cookie. Las cuentas institucionales no registran incidentes.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: IDEMPOTENCY_CONFLICT, la clave ya se uso con otro contenido. No se modifica el incidente existente.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/CuerpoDemasiadoGrande' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '503':
          description: Base de datos, catalogo o cartografia no legibles. No queda incidente parcial; reintentar con la misma clave no duplica.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /ciudadano/incidentes:
    get:
      tags: [Seguimiento]
      operationId: listarMisIncidentes
      summary: Historial privado de los incidentes registrados con la propia cuenta
      description: |
        Solo los incidentes de modalidad cuenta del titular del Bearer, del mas reciente al mas antiguo
        (desempate por identificador), en paginas de 20. `siguiente` es un cursor opaco; nulo en la ultima pagina.
        No incluye envios de invitado ni de otros autores. Unico parametro admitido: `cursor`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Pagina del historial propio (puede estar vacia).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistorialIncidentes' }
        '400':
          description: Cursor manipulado o parametros no admitidos.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: Sesion institucional por cookie. Solo el ciudadano autor consulta su historial.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /ciudadano/incidentes/{referencia}:
    get:
      tags: [Seguimiento]
      operationId: consultarMiIncidente
      summary: Detalle privado de un incidente propio
      description: |
        Datos originales del autor, estado, territorio y respuestas para SAMU. La institucion responsable es
        la principal con participacion (P4.2), sin sede ni operadores, o pendiente si falta; las actuaciones
        se informan pendientes hasta la atencion (P6). Un incidente ajeno, de invitado o inexistente responde
        el mismo 404, sin revelar si existe.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: referencia
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
      responses:
        '200':
          description: Detalle del incidente propio.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetalleIncidenteAutor' }
        '400':
          description: Parametros de consulta no admitidos.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: Sesion institucional por cookie.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/SeguimientoNoEncontrado' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /publico/seguimiento:
    post:
      tags: [Seguimiento]
      operationId: consultarSeguimientoInvitado
      summary: Vista limitada del invitado con referencia y codigo secreto
      description: |
        Sin sesion. Referencia y codigo viajan solo en el cuerpo: una solicitud con parametros en la URL se
        rechaza sin consultar. Devuelve solo estado y resumen ciudadano; nunca descripcion, punto, distrito,
        telefono, evidencias ni respuestas sanitarias. Referencia inexistente, codigo incorrecto o reemplazado e
        incidente de cuenta responden el mismo 404. Limites: 10 intentos por referencia en 15 min y 30 por IP
        en una hora (configurables), contados antes de verificar el codigo.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsultaSeguimiento' }
            example: { referencia: INC-7K3M9-Q2TXA, codigo: 7K3M-9Q2T-XAB4-CD5E }
      responses:
        '200':
          description: Estado y resumen ciudadano del incidente.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VistaSeguimientoInvitado' }
        '400':
          description: Cuerpo invalido o parametros en la URL.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/SeguimientoNoEncontrado' }
        '413': { $ref: '#/components/responses/CuerpoDemasiadoGrande' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /operador/incidentes:
    get:
      tags: [Bandeja]
      operationId: listarBandejaOperador
      summary: Bandeja FIFO de los incidentes en que participa la sede del operador
      description: |
        Solo lectura (P4.2). Incidentes con participacion de la sede del operador dentro de su ambito vigente
        (distrito y categoria del enrutamiento cubiertos por la sede; las participaciones designadas por el
        administrador son excepcion limitada al caso). Orden de llegada, del mas antiguo al mas reciente, con
        desempate por identificador, en paginas de 50. La prioridad es `SIN_EVALUAR` hasta P6 y no reordena.
        Sin telefono, coordenadas, codigo, autor, otras sedes ni operadores. Unico parametro admitido: `cursor`.
      security: [{ cookieAuth: [] }]
      parameters:
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Pagina de la bandeja (puede estar vacia).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BandejaOperador' }
        '400': { $ref: '#/components/responses/ConsultaBandejaInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ProhibidoBandeja' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /operador/incidentes/{id}:
    get:
      tags: [Bandeja]
      operationId: consultarResumenOperador
      summary: Resumen limitado de un incidente de la bandeja
      description: |
        Campos de la fila mas descripcion, ocurrencia, resultado territorial, respuestas de heridos y atencion
        medica informadas por el ciudadano y tipos de las demas instituciones participantes. Sin telefono,
        coordenadas, codigo, autor, evidencias ni detalle de evaluacion SAMU. Un incidente fuera del ambito,
        inexistente o con identificador malformado responde el mismo 404.
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Resumen del incidente.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumenIncidenteOperador' }
        '400': { $ref: '#/components/responses/ConsultaBandejaInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ProhibidoBandeja' }
        '404': { $ref: '#/components/responses/IncidenteNoDisponible' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /admin/enrutamientos-pendientes:
    get:
      tags: [Enrutamiento]
      operationId: listarEnrutamientosPendientes
      summary: Incidentes en ENRUTAMIENTO_PENDIENTE, del mas antiguo al mas reciente
      description: |
        Solo administradores (P4.2, RF35). Cada fila indica las instituciones faltantes con su papel y motivo
        (`sin_distrito` o `sin_sede_elegible`). Sin descripcion, telefono, coordenadas ni respuestas sanitarias.
        Paginas de 50 con cursor opaco. No crea avisos por usuario (P8).
      security: [{ cookieAuth: [] }]
      parameters:
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Pagina de pendientes (puede estar vacia).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendientesEnrutamiento' }
        '400': { $ref: '#/components/responses/ConsultaBandejaInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ProhibidoEnrutamiento' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /admin/enrutamientos-pendientes/{incidenteId}/designaciones:
    post:
      tags: [Enrutamiento]
      operationId: designarSedeEnrutamiento
      summary: Designar una sede habilitada para una institucion faltante
      description: |
        Excepcion limitada al caso: la sede debe estar activa y habilitada, ser de la institucion faltante y
        tener un operador activo; no se exige cobertura ni competencia y no concede acceso sanitario. Queda
        auditada con el administrador, el motivo (10 a 500 caracteres) y el instante. Dos designaciones
        simultaneas para el mismo faltante: una prospera y la otra recibe 409. El motivo no se registra en logs.
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrigenWeb'
        - name: incidenteId
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DesignacionSolicitud' }
      responses:
        '201':
          description: Participacion designada creada; el enrutamiento pasa a ENRUTADO si no quedan faltantes.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoEnrutamientoAdmin' }
        '400': { $ref: '#/components/responses/ConsultaBandejaInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ProhibidoEnrutamiento' }
        '404': { $ref: '#/components/responses/EnrutamientoNoEncontrado' }
        '409': { $ref: '#/components/responses/ConflictoEnrutamiento' }
        '413': { $ref: '#/components/responses/CuerpoDemasiadoGrande' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /admin/enrutamientos-pendientes/{incidenteId}/reevaluar:
    post:
      tags: [Enrutamiento]
      operationId: reevaluarEnrutamiento
      summary: Reevaluar los faltantes con la configuracion vigente
      description: |
        Aplica la misma version de la regla con los datos originales y las sedes elegibles vigentes, solo para
        los faltantes `sin_sede_elegible`; los `sin_distrito` se resuelven por designacion. Conserva las
        participaciones existentes. Sin cuerpo.
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrigenWeb'
        - name: incidenteId
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Resultado de la reevaluacion (puede seguir pendiente).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoEnrutamientoAdmin' }
        '400': { $ref: '#/components/responses/ConsultaBandejaInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ProhibidoEnrutamiento' }
        '404': { $ref: '#/components/responses/EnrutamientoNoEncontrado' }
        '409': { $ref: '#/components/responses/ConflictoEnrutamiento' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token opaco de sesion (32 bytes aleatorios en base64url).
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-ayni_inst
      description: |
        Sesion institucional (el mismo token opaco). Cookie HttpOnly, Secure, SameSite=Strict, Path=/. Bajo http
        local el nombre es `ayni_inst`, sin prefijo ni Secure. Solo para administradores y operadores.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generado por el cliente para este envio. Se reutiliza al reintentar el mismo contenido.
      schema: { type: string, format: uuid }
    OrigenWeb:
      name: Origin
      in: header
      required: true
      description: Debe ser identico al origen web configurado. Un origen ajeno o ausente recibe 403.
      schema: { type: string }
  headers:
    NoStore:
      description: Las respuestas de autenticacion no se almacenan en cache.
      schema: { type: string, const: no-store }
    SetCookieSesion:
      description: Cookie de sesion institucional (HttpOnly, Secure, SameSite=Strict, Path=/, Max-Age hasta el vencimiento absoluto).
      schema: { type: string }
    SetCookieBorrada:
      description: La misma cookie con Max-Age=0 para borrarla.
      schema: { type: string }
    RetryAfter:
      description: Segundos de espera antes de reintentar (el mayor plazo restante aplicable).
      schema: { type: integer, minimum: 1 }
    RetryAfterOpcional:
      description: Segundos hasta que se libere la cuota diaria. Solo cuando el 503 es por cuota agotada.
      required: false
      schema: { type: integer, minimum: 1 }
  schemas:
    DistritoTerritorial:
      type: object
      additionalProperties: false
      required: [id, nombre, ubigeo]
      properties:
        id: { type: string, enum: [DIS-01, DIS-02, DIS-03, DIS-04, DIS-05] }
        nombre: { type: string, minLength: 1 }
        ubigeo: { type: [string, 'null'], pattern: '^0501[0-9]{2}$' }
    CatalogoTerritorial:
      type: object
      additionalProperties: false
      required: [estado, version, distritos]
      properties:
        estado: { type: string, enum: [pendiente, disponible] }
        version: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        distritos:
          type: array
          minItems: 5
          maxItems: 5
          items: { $ref: '#/components/schemas/DistritoTerritorial' }
    PuntoTerritorial:
      type: object
      additionalProperties: false
      required: [latitud, longitud]
      properties:
        latitud: { type: number, minimum: -90, maximum: 90 }
        longitud: { type: number, minimum: -180, maximum: 180 }
        version: { type: string, pattern: '^[a-f0-9]{64}$' }
    ResultadoTerritorial:
      oneOf:
        - type: object
          additionalProperties: false
          required: [estado, distrito, motivo, version]
          properties:
            estado: { const: resuelto }
            distrito: { $ref: '#/components/schemas/DistritoTerritorial' }
            motivo: { type: 'null' }
            version: { type: string, pattern: '^[a-f0-9]{64}$' }
        - type: object
          additionalProperties: false
          required: [estado, distrito, motivo, version]
          properties:
            estado: { const: pendiente }
            distrito: { type: 'null' }
            motivo: { enum: [frontera, solapamiento, fuera_area] }
            version: { type: string, pattern: '^[a-f0-9]{64}$' }
    PosicionTerritorial:
      type: array
      prefixItems:
        - { type: number, minimum: -180, maximum: 180 }
        - { type: number, minimum: -90, maximum: 90 }
      items: false
      minItems: 2
      maxItems: 2
    AnilloTerritorial:
      type: array
      minItems: 4
      items: { $ref: '#/components/schemas/PosicionTerritorial' }
    PoligonoTerritorial:
      type: array
      minItems: 1
      items: { $ref: '#/components/schemas/AnilloTerritorial' }
    GeometriaTerritorial:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, coordinates]
          properties:
            type: { const: Polygon }
            coordinates: { $ref: '#/components/schemas/PoligonoTerritorial' }
        - type: object
          additionalProperties: false
          required: [type, coordinates]
          properties:
            type: { const: MultiPolygon }
            coordinates:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/PoligonoTerritorial' }
    MetadatosTerritoriales:
      type: object
      additionalProperties: false
      required: [fuente, publicador, versionFuente, actualizadoFuente, obtenidoEn, sha256Fuente, sha256GeoPackage, sha256Archivo, referencia, contraste]
      properties:
        fuente: { type: string, format: uri }
        publicador: { type: string }
        versionFuente: { type: string }
        actualizadoFuente: { type: string }
        obtenidoEn: { type: string }
        sha256Fuente: { type: string, pattern: '^[a-f0-9]{64}$' }
        sha256GeoPackage: { type: string, pattern: '^[a-f0-9]{64}$' }
        sha256Archivo: { type: string, pattern: '^[a-f0-9]{64}$' }
        referencia: { type: boolean, const: true }
        contraste: { type: string }
    LimitesTerritoriales:
      type: object
      additionalProperties: false
      required: [type, version, metadatos, features]
      properties:
        type: { const: FeatureCollection }
        version: { type: string, pattern: '^[a-f0-9]{64}$' }
        metadatos: { $ref: '#/components/schemas/MetadatosTerritoriales' }
        features:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [type, properties, geometry, bbox]
            properties:
              type: { const: Feature }
              properties: { $ref: '#/components/schemas/DistritoTerritorial' }
              geometry: { $ref: '#/components/schemas/GeometriaTerritorial' }
              bbox:
                type: array
                minItems: 4
                maxItems: 4
                items: { type: number }
    ErrorTerritorialRespuesta:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              enum: [VALIDATION_ERROR, TERRITORY_UNAVAILABLE, TERRITORY_VERSION_NOT_FOUND, INVALID_JSON, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, RATE_LIMITED, METHOD_NOT_ALLOWED]
            message: { type: string }
            requestId: { type: string, format: uuid }
    RegistroSolicitud:
      type: object
      additionalProperties: false
      required: [nombre, correo, contrasena]
      example: { nombre: "Rosa Quispe", correo: "rosa@ejemplo.com", contrasena: "contraseña de ejemplo 123" }
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
          description: 1 a 100 puntos de codigo Unicode tras recortar extremos.
        correo:
          type: string
          maxLength: 254
          description: |
            Sintaxis valida, hasta 254 caracteres tras recortar extremos. Se guarda en minusculas;
            no se eliminan puntos ni sufijos `+`.
        contrasena:
          type: string
          minLength: 15
          maxLength: 128
          writeOnly: true
          description: |
            15 a 128 puntos de codigo Unicode, con espacios, sin reglas de composicion. No se
            recorta, normaliza ni trunca.
    LoginSolicitud:
      type: object
      additionalProperties: false
      required: [correo, contrasena]
      example: { correo: "rosa@ejemplo.com", contrasena: "contraseña de ejemplo 123" }
      properties:
        correo:
          type: string
          maxLength: 254
        contrasena:
          type: string
          minLength: 15
          maxLength: 128
          writeOnly: true
    UsuarioPublico:
      type: object
      additionalProperties: false
      required: [id, nombre, correo, rol]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        correo: { type: string }
        rol: { type: string, const: ciudadano }
    RegistroRespuesta:
      type: object
      additionalProperties: false
      required: [usuario]
      example: { usuario: { id: "5482bbd9-ef53-4049-a095-19a9d0144eeb", nombre: "Rosa Quispe", correo: "rosa@ejemplo.com", rol: ciudadano } }
      properties:
        usuario: { $ref: '#/components/schemas/UsuarioPublico' }
    LoginRespuesta:
      type: object
      additionalProperties: false
      required: [token, expiresAt, usuario]
      example: { token: "Zm9vYmFyLWVqZW1wbG8tZGUtdG9rZW4tb3BhY28tMDAwMDA", expiresAt: "2026-11-22T13:48:50.555Z", usuario: { id: "5482bbd9-ef53-4049-a095-19a9d0144eeb", nombre: "Rosa Quispe", correo: "rosa@ejemplo.com", rol: ciudadano } }
      properties:
        token: { type: string }
        expiresAt:
          type: string
          format: date-time
          description: Vencimiento absoluto, 24 horas despues de la creacion. Sin renovacion.
        usuario: { $ref: '#/components/schemas/UsuarioPublico' }
    SesionRespuesta:
      type: object
      additionalProperties: false
      required: [usuario, expiresAt]
      example: { usuario: { id: "5482bbd9-ef53-4049-a095-19a9d0144eeb", nombre: "Rosa Quispe", correo: "rosa@ejemplo.com", rol: ciudadano }, expiresAt: "2026-11-22T13:48:50.555Z" }
      properties:
        usuario: { $ref: '#/components/schemas/UsuarioPublico' }
        expiresAt: { type: string, format: date-time }
    UsuarioInstitucional:
      type: object
      additionalProperties: false
      required: [id, nombre, correo, rol]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        correo: { type: string }
        rol: { type: string, enum: [administrador, operador] }
    SesionInstitucionalRespuesta:
      type: object
      additionalProperties: false
      required: [usuario, expiresAt]
      description: "Sin token, la sesion viaja solo en la cookie."
      example: { usuario: { id: "5482bbd9-ef53-4049-a095-19a9d0144eeb", nombre: "Ana Torres", correo: "ana@ejemplo.com", rol: administrador }, expiresAt: "2026-11-22T13:48:50.555Z" }
      properties:
        usuario: { $ref: '#/components/schemas/UsuarioInstitucional' }
        expiresAt: { type: string, format: date-time }
    SeccionPanel:
      type: object
      additionalProperties: false
      required: [id, titulo, disponible]
      properties:
        id: { type: string }
        titulo: { type: string }
        disponible:
          type: boolean
          description: Falso mientras la capacidad no exista; el cliente la declara aun no disponible.
    PanelRespuesta:
      type: object
      additionalProperties: false
      required: [usuario, secciones]
      properties:
        usuario: { $ref: '#/components/schemas/UsuarioInstitucional' }
        secciones:
          type: array
          items: { $ref: '#/components/schemas/SeccionPanel' }
    TipoInstitucion:
      type: string
      enum: [pnp, bomberos, samu, serenazgo]
    Institucion:
      type: object
      additionalProperties: false
      required: [id, tipo, nombre, contacto, activa]
      properties:
        id: { $ref: '#/components/schemas/TipoInstitucion' }
        tipo: { $ref: '#/components/schemas/TipoInstitucion' }
        nombre: { type: string }
        contacto: { type: [string, 'null'] }
        activa: { type: boolean }
    InstitucionCambios:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nombre: { type: string, minLength: 1, maxLength: 120 }
        contacto: { type: [string, 'null'], maxLength: 40, description: 'Vacio o null lo borra.' }
        activa: { type: boolean }
    InstitucionesRespuesta:
      type: object
      additionalProperties: false
      required: [instituciones]
      properties:
        instituciones: { type: array, items: { $ref: '#/components/schemas/Institucion' } }
    InstitucionRespuesta:
      type: object
      additionalProperties: false
      required: [institucion]
      properties:
        institucion: { $ref: '#/components/schemas/Institucion' }
    Sede:
      type: object
      additionalProperties: false
      required: [id, institucionId, nombre, distritoUbicacionId, direccion, contacto, verificacion, habilitadaAtencion, activa, esDemostracion, distritos, categorias]
      properties:
        id: { type: string, format: uuid }
        institucionId: { $ref: '#/components/schemas/TipoInstitucion' }
        nombre: { type: string }
        distritoUbicacionId: { type: [string, 'null'], description: 'Ubicacion; no implica cobertura.' }
        direccion: { type: [string, 'null'] }
        contacto: { type: [string, 'null'] }
        verificacion:
          type: object
          additionalProperties: false
          required: [estado, fuente, fecha]
          properties:
            estado: { type: string, enum: [sin_verificar, verificada] }
            fuente: { type: [string, 'null'] }
            fecha: { type: [string, 'null'], format: date }
        habilitadaAtencion: { type: boolean, description: 'Nace en false; separado de la verificacion documental.' }
        activa: { type: boolean }
        esDemostracion: { type: boolean }
        distritos: { type: array, items: { type: string } }
        categorias: { type: array, items: { type: string } }
    OperadorNuevo:
      type: object
      additionalProperties: false
      required: [nombre, correo]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 100 }
        correo: { type: string, maxLength: 254 }
    SedeAlta:
      type: object
      additionalProperties: false
      required: [institucionId, nombre, operador]
      example: { institucionId: pnp, nombre: "Comisaría PNP Ayacucho «A»", distritoUbicacionId: DIS-01, operador: { nombre: "Rosa Quispe", correo: "rosa@ejemplo.com" } }
      properties:
        institucionId: { $ref: '#/components/schemas/TipoInstitucion' }
        nombre: { type: string, minLength: 1, maxLength: 150 }
        distritoUbicacionId: { type: [string, 'null'] }
        direccion: { type: [string, 'null'], maxLength: 200 }
        contacto: { type: [string, 'null'], maxLength: 40 }
        esDemostracion: { type: boolean, default: false }
        operador: { $ref: '#/components/schemas/OperadorNuevo' }
    SedeCambios:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nombre: { type: string, minLength: 1, maxLength: 150 }
        distritoUbicacionId: { type: [string, 'null'] }
        direccion: { type: [string, 'null'], maxLength: 200 }
        contacto: { type: [string, 'null'], maxLength: 40 }
        activa: { type: boolean }
        verificacion:
          oneOf:
            - type: object
              additionalProperties: false
              required: [estado]
              properties:
                estado: { const: sin_verificar }
            - type: object
              additionalProperties: false
              required: [estado, fuente, fecha]
              properties:
                estado: { const: verificada }
                fuente: { type: string, minLength: 1, maxLength: 300 }
                fecha: { type: string, format: date }
    ConjuntoDistritos:
      type: object
      additionalProperties: false
      required: [distritos]
      properties:
        distritos: { type: array, maxItems: 32, uniqueItems: true, items: { type: string, pattern: '^[A-Z]{3}-[0-9]{2}$' } }
    ConjuntoCategorias:
      type: object
      additionalProperties: false
      required: [categorias]
      properties:
        categorias: { type: array, maxItems: 32, uniqueItems: true, items: { type: string, pattern: '^[a-z]+(-[a-z]+)*$' } }
    SedesRespuesta:
      type: object
      additionalProperties: false
      required: [sedes]
      properties:
        sedes: { type: array, items: { $ref: '#/components/schemas/Sede' } }
    SedeRespuesta:
      type: object
      additionalProperties: false
      required: [sede]
      properties:
        sede: { $ref: '#/components/schemas/Sede' }
    OperadorSede:
      type: object
      additionalProperties: false
      required: [id, nombre, correo, estado, sedeId, esDemostracion]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        correo: { type: string }
        estado: { type: string, enum: [pendiente_activacion, activo, suspendido] }
        sedeId: { type: string, format: uuid }
        esDemostracion: { type: boolean }
    SedeCreadaRespuesta:
      type: object
      additionalProperties: false
      required: [sede, operador]
      properties:
        sede: { $ref: '#/components/schemas/Sede' }
        operador: { $ref: '#/components/schemas/OperadorSede' }
    OperadorAlta:
      type: object
      additionalProperties: false
      required: [nombre, correo]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 100 }
        correo: { type: string, maxLength: 254 }
        esDemostracion: { type: boolean, default: false }
    OperadorCambio:
      type: object
      additionalProperties: false
      required: [estado]
      properties:
        estado: { type: string, enum: [activo, suspendido] }
    OperadoresRespuesta:
      type: object
      additionalProperties: false
      required: [operadores]
      properties:
        operadores: { type: array, items: { $ref: '#/components/schemas/OperadorSede' } }
    OperadorRespuesta:
      type: object
      additionalProperties: false
      required: [operador]
      properties:
        operador: { $ref: '#/components/schemas/OperadorSede' }
    InvitacionRespuesta:
      type: object
      additionalProperties: false
      required: [estado]
      properties:
        estado: { const: invitacion_encolada }
    AmbitoRespuesta:
      type: object
      additionalProperties: false
      required: [ambito]
      properties:
        ambito:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [institucion, sede, distritos, categorias, habilitadaAtencion]
              properties:
                institucion:
                  type: object
                  additionalProperties: false
                  required: [id, nombre]
                  properties:
                    id: { $ref: '#/components/schemas/TipoInstitucion' }
                    nombre: { type: string }
                sede:
                  type: object
                  additionalProperties: false
                  required: [id, nombre]
                  properties:
                    id: { type: string, format: uuid }
                    nombre: { type: string }
                distritos: { type: array, items: { type: string } }
                categorias: { type: array, items: { type: string } }
                habilitadaAtencion: { type: boolean }
    Categoria:
      type: object
      additionalProperties: false
      required: [id, nombre, orden, activa]
      properties:
        id: { type: string, pattern: '^[a-z]+(-[a-z]+)*$' }
        nombre: { type: string }
        orden: { type: integer, minimum: 1, maximum: 16 }
        activa: { type: boolean }
    CatalogoCategorias:
      type: object
      additionalProperties: false
      required: [categorias]
      properties:
        categorias: { type: array, items: { $ref: '#/components/schemas/Categoria' } }
    ErrorCatalogoRespuesta:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code: { enum: [VALIDATION_ERROR, SERVICE_UNAVAILABLE, METHOD_NOT_ALLOWED] }
            message: { type: string }
            requestId: { type: string, format: uuid }
    RecuperacionSolicitud:
      type: object
      additionalProperties: false
      required: [correo]
      example: { correo: "rosa@ejemplo.com" }
      properties:
        correo:
          type: string
          maxLength: 254
          description: Misma validacion y normalizacion que el registro y el acceso.
    RecuperacionRespuesta:
      type: object
      additionalProperties: false
      required: [estado]
      example: { estado: solicitud_recibida }
      properties:
        estado: { type: string, const: solicitud_recibida }
    TokenSolicitud:
      type: object
      additionalProperties: false
      required: [token]
      example: { token: "Zm9vYmFyLWVqZW1wbG8tZGUtdG9rZW4tb3BhY28tMDAwMDA" }
      properties:
        token:
          type: string
          minLength: 1
          description: Token opaco del enlace o codigo pegado a mano (43 caracteres base64url).
    ConsumoTokenSolicitud:
      type: object
      additionalProperties: false
      required: [token, contrasena]
      example: { token: "Zm9vYmFyLWVqZW1wbG8tZGUtdG9rZW4tb3BhY28tMDAwMDA", contrasena: "una contraseña nueva de ejemplo" }
      properties:
        token: { type: string, minLength: 1 }
        contrasena:
          type: string
          minLength: 15
          maxLength: 128
          writeOnly: true
          description: "Misma politica que el registro: 15 a 128 puntos de codigo, sin recortar ni normalizar."
    ConsultaTokenRespuesta:
      type: object
      additionalProperties: false
      required: [proposito, expiresAt]
      example: { proposito: recuperacion, expiresAt: "2026-11-21T12:30:00.000Z" }
      properties:
        proposito: { type: string, enum: [recuperacion, activacion] }
        expiresAt: { type: string, format: date-time }
    Perfil:
      type: object
      additionalProperties: false
      required: [id, nombre, correo, telefono, compartirTelefono]
      example: { id: "5482bbd9-ef53-4049-a095-19a9d0144eeb", nombre: "Rosa Quispe", correo: "rosa@ejemplo.com", telefono: "+51987654321", compartirTelefono: false }
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        correo: { type: string, description: "Solo lectura. No se presenta como verificado." }
        telefono:
          type: [string, 'null']
          description: Normalizado; nulo si no se registro.
        compartirTelefono:
          type: boolean
          description: Autorizacion vigente para compartir el telefono. Por ahora solo se guarda; nadie lo recibe.
    PerfilCambios:
      type: object
      additionalProperties: false
      minProperties: 1
      example: { nombre: "Rosa Quispe", telefono: "+51 987-654-321", compartirTelefono: true }
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
          description: 1 a 100 puntos de codigo Unicode tras recortar extremos.
        telefono:
          type: [string, 'null']
          description: 7 a 15 digitos con `+` inicial opcional (se admiten espacios, guiones, puntos y parentesis). `null` o vacio lo borra.
        compartirTelefono:
          type: boolean
          description: Requiere un telefono registrado o enviado en la misma solicitud.
    EstadoAprobacion:
      type: string
      enum: [aprobado, pendiente]
    ContenidoPublico:
      type: object
      additionalProperties: false
      required: [version, actualizadoAt, app, piloto, desarrolladores, privacidad, contactos]
      properties:
        version: { type: integer, minimum: 1 }
        actualizadoAt: { type: string, format: date }
        app:
          type: object
          additionalProperties: false
          required: [estado]
          properties:
            estado: { $ref: '#/components/schemas/EstadoAprobacion' }
            finalidad: { type: string }
            funcionamiento: { type: string }
        piloto:
          type: object
          description: Alcance del piloto. Pendiente y sin texto hasta que el equipo lo apruebe.
          additionalProperties: false
          required: [estado]
          properties:
            estado: { $ref: '#/components/schemas/EstadoAprobacion' }
            texto: { type: string }
        desarrolladores:
          type: object
          additionalProperties: false
          required: [estado]
          properties:
            estado: { $ref: '#/components/schemas/EstadoAprobacion' }
            personas:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [nombre, rol]
                properties:
                  nombre: { type: string }
                  rol: { type: string }
        privacidad:
          type: object
          additionalProperties: false
          required: [estado]
          properties:
            estado: { $ref: '#/components/schemas/EstadoAprobacion' }
            secciones:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [titulo, texto]
                properties:
                  titulo: { type: string }
                  texto: { type: string }
        contactos:
          type: object
          additionalProperties: false
          required: [estado, items]
          properties:
            estado: { $ref: '#/components/schemas/EstadoAprobacion' }
            items:
              type: array
              description: Vacia mientras no haya contactos aprobados.
              items:
                type: object
                additionalProperties: false
                required: [institucion, numero, cobertura, fuente, verificadoAt]
                properties:
                  institucion: { type: string }
                  numero: { type: string }
                  cobertura: { type: string }
                  fuente: { type: string }
                  verificadoAt: { type: string, format: date }
    EnvioIncidente:
      type: object
      additionalProperties: false
      required: [categoriaId, descripcion, ocurrencia, punto]
      description: |
        Datos originales del envio. No admite institucion, sede, prioridad, estado, distrito, autor ni referencia.
        `heridos` solo en accidente-transito, agresion, pelea y violencia; `atencionMedica` solo en
        accidente-transito; omitirlas es sin respuesta, distinto de `no`. `telefonoContacto` es obligatorio
        como invitado y no se admite con cuenta.
      properties:
        categoriaId: { type: string, description: Identificador estable de una categoria activa. }
        descripcion:
          type: string
          description: 5 a 1000 caracteres tras recortar espacios. En otra-emergencia debe precisar el hecho.
        ocurrencia:
          type: object
          additionalProperties: false
          required: [modo, instante]
          properties:
            modo: { type: string, enum: [ahora, antes] }
            instante:
              type: string
              description: ISO 8601 con zona horaria. Hasta 5 minutos en el futuro y no anterior a 30 dias.
        punto:
          type: object
          additionalProperties: false
          required: [latitud, longitud, origen]
          properties:
            latitud: { type: number, minimum: -90, maximum: 90 }
            longitud: { type: number, minimum: -180, maximum: 180 }
            origen: { type: string, enum: [gps, manual] }
            precisionM: { type: [number, 'null'], minimum: 0, maximum: 100000 }
        heridos: { type: [string, 'null'], enum: [si, no, no_se, null] }
        atencionMedica: { type: [string, 'null'], enum: [si, no, no_se, null] }
        telefonoContacto: { type: string, description: "7 a 15 digitos con + opcional; se aceptan espacios, guiones, puntos y parentesis." }
    ComprobanteIncidente:
      type: object
      additionalProperties: false
      required: [referencia, estado, recibidoEn, modalidad, territorio]
      description: Sin telefono, coordenadas, autor ni datos de enrutamiento.
      properties:
        referencia:
          type: string
          pattern: '^INC-[0-9A-HJKMNP-TV-Z]{5}-[0-9A-HJKMNP-TV-Z]{5}$'
          description: Referencia publica no secuencial. Por si sola no concede acceso.
        estado: { type: string, enum: [REGISTRADO, EN_REVISION, EN_ATENCION, CERRADO] }
        recibidoEn: { type: string, format: date-time, description: Instante de registro del servidor. }
        modalidad: { type: string, enum: [invitado, cuenta] }
        territorio: { $ref: '#/components/schemas/TerritorioIncidente' }
        codigoSeguimiento:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{4}(-[0-9A-HJKMNP-TV-Z]{4}){3}$'
          description: Solo invitado. Se muestra una unica vez; el servidor guarda solo su huella.
    TerritorioIncidente:
      description: Distrito resuelto por el backend o pendiente con su motivo.
      oneOf:
        - type: object
          additionalProperties: false
          required: [estado, distrito]
          properties:
            estado: { const: resuelto }
            distrito:
              type: object
              additionalProperties: false
              required: [id, nombre]
              properties:
                id: { type: string }
                nombre: { type: [string, 'null'] }
        - type: object
          additionalProperties: false
          required: [estado, motivo]
          properties:
            estado: { const: pendiente }
            motivo: { type: string, enum: [frontera, solapamiento, fuera_area, sin_cartografia] }
    CategoriaVista:
      type: object
      additionalProperties: false
      required: [id, nombre]
      properties:
        id: { type: string }
        nombre: { type: [string, 'null'] }
    InstitucionPendiente:
      type: object
      additionalProperties: false
      required: [estado]
      description: Sin principal con participacion la institucion responsable queda pendiente; no se inventa.
      properties:
        estado: { const: pendiente }
    InstitucionResponsable:
      description: Principal con participacion (tipo y nombre, sin sede ni operadores) o pendiente. Un estado desconocido se trata como pendiente.
      oneOf:
        - { $ref: '#/components/schemas/InstitucionPendiente' }
        - type: object
          additionalProperties: false
          required: [estado, institucion]
          properties:
            estado: { const: asignada }
            institucion:
              type: object
              additionalProperties: false
              required: [id, nombre]
              properties:
                id: { $ref: '#/components/schemas/TipoInstitucionDestino' }
                nombre: { type: string }
    TipoInstitucionDestino:
      type: string
      enum: [pnp, bomberos, samu, serenazgo]
    PapelInstitucion:
      type: string
      enum: [principal, simultanea, condicionada]
    Faltante:
      type: object
      additionalProperties: false
      required: [institucion, papel, motivo]
      properties:
        institucion: { $ref: '#/components/schemas/TipoInstitucionDestino' }
        papel: { $ref: '#/components/schemas/PapelInstitucion' }
        motivo: { type: string, enum: [sin_distrito, sin_sede_elegible] }
    DistritoVista:
      type: object
      additionalProperties: false
      required: [id, nombre]
      properties:
        id: { type: string }
        nombre: { type: [string, 'null'] }
    CamposFilaBandeja:
      type: object
      required: [id, referencia, categoria, distrito, estado, registradoEn, papel, condicionMedicaPorConfirmar, prioridad]
      properties:
        id: { type: string, format: uuid }
        referencia: { type: string }
        categoria: { $ref: '#/components/schemas/CategoriaVista' }
        distrito:
          description: Nulo si el incidente no tiene distrito resuelto (solo visible por designacion).
          oneOf:
            - { $ref: '#/components/schemas/DistritoVista' }
            - { type: 'null' }
        estado: { type: string, enum: [REGISTRADO, EN_REVISION, EN_ATENCION, CERRADO] }
        registradoEn: { type: string, format: date-time }
        papel: { $ref: '#/components/schemas/PapelInstitucion' }
        condicionMedicaPorConfirmar:
          type: boolean
          description: Heridos o atencion medica desconocidos; pendiente de revision, no equivale a «no».
        prioridad: { const: SIN_EVALUAR }
    FilaBandejaOperador:
      allOf:
        - { $ref: '#/components/schemas/CamposFilaBandeja' }
      unevaluatedProperties: false
    BandejaOperador:
      type: object
      additionalProperties: false
      required: [elementos, siguiente]
      properties:
        elementos:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/FilaBandejaOperador' }
        siguiente: { type: [string, 'null'] }
    ResumenIncidenteOperador:
      allOf:
        - { $ref: '#/components/schemas/CamposFilaBandeja' }
      type: object
      unevaluatedProperties: false
      required: [descripcion, ocurrencia, territorio, respuestasCiudadano, otrasInstituciones]
      properties:
        descripcion: { type: string }
        ocurrencia:
          type: object
          additionalProperties: false
          required: [modo, instante]
          properties:
            modo: { type: string, enum: [ahora, antes] }
            instante: { type: string, format: date-time }
        territorio: { $ref: '#/components/schemas/TerritorioIncidente' }
        respuestasCiudadano:
          type: object
          additionalProperties: false
          required: [heridos, atencionMedica]
          description: Informadas por el ciudadano, sin revision clinica.
          properties:
            heridos: { enum: [si, no, no_se, null] }
            atencionMedica: { enum: [si, no, no_se, null] }
        otrasInstituciones:
          type: array
          items: { $ref: '#/components/schemas/TipoInstitucionDestino' }
    FilaPendienteEnrutamiento:
      type: object
      additionalProperties: false
      required: [incidenteId, referencia, categoria, territorio, registradoEn, faltantes]
      properties:
        incidenteId: { type: string, format: uuid }
        referencia: { type: string }
        categoria: { $ref: '#/components/schemas/CategoriaVista' }
        territorio:
          description: Distrito usado por la regla o motivo territorial original.
          oneOf:
            - type: object
              additionalProperties: false
              required: [estado, distrito]
              properties:
                estado: { const: resuelto }
                distrito: { $ref: '#/components/schemas/DistritoVista' }
            - type: object
              additionalProperties: false
              required: [estado, motivo]
              properties:
                estado: { const: pendiente }
                motivo: { type: string, enum: [frontera, solapamiento, fuera_area, sin_cartografia, sin_distrito] }
        registradoEn: { type: string, format: date-time }
        faltantes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Faltante' }
    PendientesEnrutamiento:
      type: object
      additionalProperties: false
      required: [elementos, siguiente]
      properties:
        elementos:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/FilaPendienteEnrutamiento' }
        siguiente: { type: [string, 'null'] }
    DesignacionSolicitud:
      type: object
      additionalProperties: false
      required: [institucion, sedeId, motivo]
      properties:
        institucion: { $ref: '#/components/schemas/TipoInstitucionDestino' }
        sedeId: { type: string, format: uuid }
        motivo: { type: string, minLength: 10, maxLength: 500 }
    ResultadoEnrutamientoAdmin:
      type: object
      additionalProperties: false
      required: [enrutamiento]
      properties:
        enrutamiento:
          type: object
          additionalProperties: false
          required: [incidenteId, resultado, faltantes]
          properties:
            incidenteId: { type: string, format: uuid }
            resultado: { type: string, enum: [ENRUTADO, ENRUTAMIENTO_PENDIENTE] }
            faltantes:
              type: array
              items: { $ref: '#/components/schemas/Faltante' }
    ElementoHistorial:
      type: object
      additionalProperties: false
      required: [referencia, categoria, estado, recibidoEn, territorio]
      properties:
        referencia: { type: string }
        categoria: { $ref: '#/components/schemas/CategoriaVista' }
        estado: { type: string, enum: [REGISTRADO, EN_REVISION, EN_ATENCION, CERRADO] }
        recibidoEn: { type: string, format: date-time }
        territorio: { $ref: '#/components/schemas/TerritorioIncidente' }
    HistorialIncidentes:
      type: object
      additionalProperties: false
      required: [elementos, siguiente]
      properties:
        elementos:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ElementoHistorial' }
        siguiente: { type: [string, 'null'], description: Cursor opaco de la pagina siguiente. }
    DetalleIncidenteAutor:
      type: object
      additionalProperties: false
      required: [referencia, categoria, estado, recibidoEn, territorio, descripcion, ocurrencia, respuestas, institucionResponsable, actuaciones]
      description: Sin coordenadas, telefono, notas internas, operadores ni datos de otros informantes.
      properties:
        referencia: { type: string }
        categoria: { $ref: '#/components/schemas/CategoriaVista' }
        estado: { type: string, enum: [REGISTRADO, EN_REVISION, EN_ATENCION, CERRADO] }
        recibidoEn: { type: string, format: date-time }
        territorio: { $ref: '#/components/schemas/TerritorioIncidente' }
        descripcion: { type: string }
        ocurrencia:
          type: object
          additionalProperties: false
          required: [modo, instante]
          properties:
            modo: { type: string, enum: [ahora, antes] }
            instante: { type: string, format: date-time }
        respuestas:
          type: object
          additionalProperties: false
          required: [heridos, atencionMedica]
          properties:
            heridos: { type: [string, 'null'], enum: [si, no, no_se, null] }
            atencionMedica: { type: [string, 'null'], enum: [si, no, no_se, null] }
        institucionResponsable: { $ref: '#/components/schemas/InstitucionResponsable' }
        actuaciones: { type: array, maxItems: 0 }
    ConsultaSeguimiento:
      type: object
      additionalProperties: false
      required: [referencia, codigo]
      properties:
        referencia: { type: string, maxLength: 40 }
        codigo: { type: string, maxLength: 40 }
    VistaSeguimientoInvitado:
      type: object
      additionalProperties: false
      required: [referencia, categoria, estado, recibidoEn, institucionResponsable, actuaciones]
      description: Solo estado y resumen ciudadano. Sin descripcion, punto, distrito, telefono ni respuestas sanitarias.
      properties:
        referencia: { type: string }
        categoria: { $ref: '#/components/schemas/CategoriaVista' }
        estado: { type: string, enum: [REGISTRADO, EN_REVISION, EN_ATENCION, CERRADO] }
        recibidoEn: { type: string, format: date-time }
        institucionResponsable: { $ref: '#/components/schemas/InstitucionResponsable' }
        actuaciones: { type: array, maxItems: 0 }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - EMAIL_IN_USE
                - INVALID_CREDENTIALS
                - UNAUTHENTICATED
                - FORBIDDEN_ORIGIN
                - FORBIDDEN
                - TOKEN_INVALID
                - TOKEN_USED
                - TOKEN_EXPIRED
                - PAYLOAD_TOO_LARGE
                - UNSUPPORTED_MEDIA_TYPE
                - RATE_LIMITED
                - SERVICE_UNAVAILABLE
                - INTERNAL_ERROR
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - SEDE_EXISTENTE
                - REQUISITOS_HABILITACION
                - ULTIMO_OPERADOR_ACTIVO
                - SEDE_HABILITADA
                - INVITACION_NO_APLICABLE
                - IDEMPOTENCY_KEY_REQUIRED
                - IDEMPOTENCY_CONFLICT
                - TRACKING_NOT_FOUND
                - FALTANTE_INEXISTENTE
                - SEDE_NO_DESIGNABLE
                - ENRUTAMIENTO_NO_PENDIENTE
            message: { type: string }
            requisitos:
              type: array
              description: Solo en SEDE_NO_DESIGNABLE. Requisitos incumplidos de la sede.
              items: { type: string, enum: [sede_existente, misma_institucion, institucion_activa, sede_activa, sede_habilitada, operador_activo] }
            faltantes:
              type: array
              description: Solo en REQUISITOS_HABILITACION. Requisitos incumplidos, en orden estable.
              items: { type: string, enum: [institucion_activa, sede_activa, sede_verificada, cobertura, competencias, operador_activo] }
            fields:
              type: object
              description: Mensaje por campo. Nunca contiene el valor enviado.
              additionalProperties: { type: string }
            requestId:
              type: string
              description: Identificador aleatorio de la solicitud; no contiene datos de cuenta.
  responses:
    ConsultaBandejaInvalida:
      description: Cursor manipulado, parametros no admitidos o cuerpo invalido (con `fields` por campo).
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ProhibidoBandeja:
      description: |
        `FORBIDDEN` si la sesion no es de operador (administrador o ciudadano) o si su sede no esta habilitada
        para atencion. Sin datos de incidentes.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    IncidenteNoDisponible:
      description: Incidente fuera del ambito, inexistente o con identificador malformado. Misma respuesta para todas las causas.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: NOT_FOUND, message: "Incidente no disponible.", requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } }
    ProhibidoEnrutamiento:
      description: |
        `FORBIDDEN` si la sesion no es de administrador o `FORBIDDEN_ORIGIN` si la modificacion no viene del
        origen web configurado.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    EnrutamientoNoEncontrado:
      description: El incidente no existe, no tiene enrutamiento o el identificador no tiene el formato esperado.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ConflictoEnrutamiento:
      description: |
        `FALTANTE_INEXISTENTE` (la institucion ya no falta, incluida una designacion concurrente),
        `SEDE_NO_DESIGNABLE` (con `requisitos`) o `ENRUTAMIENTO_NO_PENDIENTE`. Sin cambios parciales.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: SEDE_NO_DESIGNABLE, message: "La sede elegida no cumple los requisitos para recibir el caso.", requisitos: [sede_habilitada], requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } }
    SeguimientoNoEncontrado:
      description: Referencia inexistente, incidente ajeno o de otra modalidad, o codigo incorrecto. Misma respuesta para todas las causas.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: TRACKING_NOT_FOUND, message: "Referencia o código incorrectos.", requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } }
    RecursoNoEncontrado:
      description: La institucion, sede u operador no existe (o el identificador no tiene el formato esperado).
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: NOT_FOUND, message: "El recurso no existe.", requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } }
    ConflictoOrganizacion:
      description: |
        La operacion romperia una invariante: `SEDE_EXISTENTE`, `EMAIL_IN_USE`, `REQUISITOS_HABILITACION`
        (con `faltantes`), `SEDE_HABILITADA`, `ULTIMO_OPERADOR_ACTIVO` o `INVITACION_NO_APLICABLE`. No hay
        cambios parciales y no se revelan datos de otras cuentas.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: REQUISITOS_HABILITACION, message: "La sede no cumple los requisitos para habilitarse.", faltantes: [cobertura, operador_activo], requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } }
    ProhibidoOrganizacion:
      description: |
        `FORBIDDEN` si la sesion es de otro rol (un operador no administra la organizacion, ni siquiera de su
        sede) o `FORBIDDEN_ORIGIN` si la modificacion no viene del origen web configurado.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ErrorCatalogo:
      description: Parametros no admitidos (400) o catalogo no disponible (503), sin detalles internos.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorCatalogoRespuesta' }
    ErrorConsultaTerritorial:
      description: Error territorial de validación, disponibilidad, versión o formato; sin ubicación ni detalles internos. Los métodos no admitidos reciben 405 con Allow y este mismo esquema.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorTerritorialRespuesta' }
    OrigenNoPermitido:
      description: |
        La solicitud no viene del origen web configurado (falta `Origin`, es otro, o `Sec-Fetch-Site` es
        `cross-site`). No toca cookies ni sesiones y se evalua antes de limitar intentos.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: FORBIDDEN_ORIGIN, message: "La solicitud no proviene de un origen permitido.", requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } }
    RolNoPermitido:
      description: Sesion institucional valida de otro rol. No devuelve datos del panel.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: FORBIDDEN, message: "Tu cuenta no tiene permiso para este recurso.", requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } }
    ValidacionInvalida:
      description: Campos ausentes, tipos incorrectos, valores fuera de regla o campos no admitidos.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: VALIDATION_ERROR, message: "Revisa los datos ingresados.", fields: { correo: "Ingresa un correo válido." }, requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } }
    CorreoEnUso:
      description: El correo normalizado ya esta registrado. No revela nombre, rol ni estado.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: EMAIL_IN_USE, message: "Este correo ya está registrado. Inicia sesión.", requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } }
    CredencialesInvalidas:
      description: Correo o contrasena incorrectos (mismo mensaje para todas las causas).
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: INVALID_CREDENTIALS, message: "Correo o contraseña incorrectos.", requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } }
    NoAutenticado:
      description: Token ausente, invalido, vencido, revocado o de cuenta no habilitada.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: UNAUTHENTICATED, message: "Tu sesión no es válida. Inicia sesión de nuevo.", requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } }
    CuerpoDemasiadoGrande:
      description: El cuerpo JSON supera 8 KiB.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: PAYLOAD_TOO_LARGE, message: "La solicitud es demasiado grande.", requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } }
    TipoNoSoportado:
      description: Content-Type distinto de application/json.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: UNSUPPORTED_MEDIA_TYPE, message: "El contenido debe enviarse como application/json en UTF-8.", requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } }
    LimiteExcedido:
      description: Limite de intentos superado. No se crea cuenta ni sesion.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: RATE_LIMITED, message: "Demasiados intentos. Espera antes de volver a intentar.", requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } }
    ServicioNoDisponible:
      description: Base de datos, hash o dependencia interna no disponible. Reintento manual.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: SERVICE_UNAVAILABLE, message: "El servicio no está disponible por ahora. Inténtalo de nuevo en unos minutos.", requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } }
    ErrorInterno:
      description: Error inesperado. Mensaje generico y requestId, sin detalles internos.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: INTERNAL_ERROR, message: "Ocurrió un error inesperado. Si persiste, indica el código de la solicitud.", requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } }
    TokenInvalido:
      description: Token desconocido, alterado, de otro proposito o de una cuenta que ya no puede usarlo.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: TOKEN_INVALID, message: "El enlace o el código no es válido.", requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } }
    TokenNoVigente:
      description: |
        El token ya se uso o fue reemplazado por uno mas reciente (`TOKEN_USED`), o su plazo termino
        (`TOKEN_EXPIRED`). La app ofrece solicitar otro enlace.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            usado: { value: { error: { code: TOKEN_USED, message: "Este enlace ya se usó o fue reemplazado por uno más reciente.", requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } } }
            vencido: { value: { error: { code: TOKEN_EXPIRED, message: "Este enlace venció. Solicita uno nuevo.", requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } } }
    ServicioNoDisponibleConCuota:
      description: |
        Dependencia interna no disponible, o tope diario global de correos agotado. En el segundo caso
        incluye Retry-After; la respuesta es la misma para toda solicitud valida, exista o no la cuenta.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Retry-After: { $ref: '#/components/headers/RetryAfterOpcional' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: SERVICE_UNAVAILABLE, message: "No podemos enviar más correos por hoy. Inténtalo de nuevo más tarde.", requestId: "2adb1a23-ba50-4f5b-a4bc-5ba5a478e614" } }
