        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /administrador/organizacion/operadores/{id}:
    patch:
      tags: [Organizacion]
      operationId: cambiarEstadoOperador
      summary: Suspender o reactivar un operador
      description: |
        Suspender revoca sus sesiones y sus enlaces de activacion sin usar en la misma transaccion; dejar sin
        operador activo una sede habilitada responde 409 `ULTIMO_OPERADOR_ACTIVO`. Reactivar devuelve la cuenta a
        activa o, si nunca se activo, a pendiente (hace falta reenviar la invitacion). No borra filas.
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, description: 'Identificador (UUID) del operador. Una cuenta que no es operador con sede responde 404.', schema: { type: string } }
        - $ref: '#/components/parameters/OrigenWeb'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperadorCambio' }
      responses:
        '200':
          description: Estado del operador.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperadorRespuesta' }
        '400': { $ref: '#/components/responses/ValidacionInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ProhibidoOrganizacion' }
        '404': { $ref: '#/components/responses/RecursoNoEncontrado' }
        '409': { $ref: '#/components/responses/ConflictoOrganizacion' }
        '413': { $ref: '#/components/responses/CuerpoDemasiadoGrande' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
