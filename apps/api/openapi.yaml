            application/json:
              schema: { $ref: '#/components/schemas/SedeRespuesta' }
        '400': { $ref: '#/components/responses/ValidacionInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ProhibidoOrganizacion' }
        '404': { $ref: '#/components/responses/RecursoNoEncontrado' }
        '409': { $ref: '#/components/responses/ConflictoOrganizacion' }
        '413': { $ref: '#/components/responses/CuerpoDemasiadoGrande' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /administrador/organizacion/sedes/{id}/habilitacion:
    post:
      tags: [Organizacion]
      operationId: habilitarSede
      summary: Habilitar la sede para atencion
      description: |
        Exige institucion activa, sede activa y verificada, al menos un distrito, una categoria y un operador
        activo. Si falta alguno responde 409 `REQUISITOS_HABILITACION` con la lista `faltantes`. Sin cuerpo.
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, description: 'Identificador (UUID) de la sede. Un valor que no es UUID o no existe responde 404.', schema: { type: string } }
        - $ref: '#/components/parameters/OrigenWeb'
      responses:
        '200':
          description: Sede habilitada.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SedeRespuesta' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ProhibidoOrganizacion' }
        '404': { $ref: '#/components/responses/RecursoNoEncontrado' }
        '409': { $ref: '#/components/responses/ConflictoOrganizacion' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
    delete:
      tags: [Organizacion]
      operationId: deshabilitarSede
      summary: Deshabilitar la sede para atencion
      description: |
        Idempotente. No borra la sede, sus operadores ni su configuracion.
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, description: 'Identificador (UUID) de la sede. Un valor que no es UUID o no existe responde 404.', schema: { type: string } }
