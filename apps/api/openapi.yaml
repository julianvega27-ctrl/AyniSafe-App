openapi: 3.1.0
info:
  title: AyniSafe API - Identidad, organización, contenido público, territorio y categorías
  version: 0.8.0
  description: |
    Contrato del modulo Identidad: registro, inicio de sesion, consulta y cierre de sesion del
    ciudadano (entrega `registro-login-ciudadano`), mas recuperacion de contrasena y activacion de
    cuentas invitadas por correo (entrega `correo-recuperacion-activacion`), mas el perfil del propio
    ciudadano y el contenido publico (entrega `perfil-navegacion-movil`), mas el acceso institucional
    de administradores y operadores desde la web y sus paneles minimos (entrega
    `web-publica-acceso-institucional`).

    Reglas transversales:
    - Solo HTTPS en entornos compartidos. Credenciales unicamente en el cuerpo JSON.
    - La sesion viaja solo en `Authorization: Bearer <token>`; nunca en la URL.
    - Todas las respuestas de este contrato llevan `Cache-Control: no-store`.
    - Cuerpos JSON de hasta 8 KiB. Campos no declarados se rechazan con 400.
    - Limitacion de intentos (ventanas fijas de 15 minutos, configurables): registro 5 solicitudes por IP;
      acceso 30 por IP y 5 por combinacion correo+IP. Al superarlos se responde 429 con Retry-After.
    - La sesion dura 24 horas desde su creacion, sin renovacion.
    - Recuperacion y activacion: rutas publicas sin Bearer; la credencial es un token de un solo uso en el
      cuerpo (vence a los 30 min en recuperacion y a las 72 h en activacion). Cambiar la contrasena
      revoca todas las sesiones del usuario y no inicia sesion. No se verifica el correo.
    - Limites adicionales (configurables): recuperacion 10 por IP y 3 por correo+IP en 15 min, y 3 por
      correo por hora; consulta y consumo de tokens 20 por IP en 15 min. Tope diario global de
      solicitudes de recuperacion (por defecto 400, bajo la cuota de Gmail): al agotarse, 503 con Retry-After.
    - Perfil (`/perfil`): solo del titular de la sesion (Bearer); no hay ruta ni campo para elegir otro
      usuario. Admite editar `nombre`, `telefono` (opcional) y `compartirTelefono`; el correo es de solo lectura
      y cualquier otro campo (`correo`, `id`, `rol`, `estado`) se rechaza con 400. El telefono nunca aparece en
      `/auth/sesion`. La autorizacion de compartirlo solo se guarda: esta entrega no lo comparte con nadie.
    - Contenido publico (`/publico/contenido`): sin sesion, solo lectura (otros metodos reciben 405 con
      `Allow`), cache publica breve (no `no-store`). Cada seccion declara `aprobado` o `pendiente` y solo
      publica texto cuando esta aprobada; los contactos de emergencia estan vacios mientras no haya
      ninguno aprobado.
    - Acceso institucional (`/auth/institucional/*`): la sesion es el mismo token opaco de 24 h absolutas,
      sin renovacion, pero viaja SOLO en una cookie `HttpOnly; Secure; SameSite=Strict; Path=/` (sin `Domain`;
      con el prefijo `__Host-` bajo https) y nunca en el cuerpo. La web y la API comparten origen (reescritura
      de `/api/*`), por lo que la API no emite cabeceras CORS. Las rutas con cookie que cambian estado o inician
      sesion exigen `Origin` identico al origen web configurado y rechazan `Sec-Fetch-Site: cross-site`
      (403 `FORBIDDEN_ORIGIN`). Los paneles aceptan solo la cookie (ignoran `Authorization`) y las rutas
      ciudadanas solo Bearer: ninguna sesion vale en el otro canal. Un rol distinto del requerido recibe 403
      `FORBIDDEN`. Limites propios: 30 por IP y 5 por correo+IP en 15 min (`login_inst_*`).
    - Organizacion P3.2 (`/administrador/organizacion/*`): solo administradores activos (cookie); las
      modificaciones exigen ademas el origen web. Catalogo cerrado de cuatro instituciones sin ruta de alta.
      Los operadores solo se crean junto con su sede (alta atomica con invitacion) o agregados a una sede
      existente; ninguna ruta crea administradores. Administrar no concede lectura de incidentes ni permisos
      de atencion. Metodos no declarados reciben 405 con `Allow`. El operador lee solo su propio ambito
      (`/operador/ambito`). Sin cache de aplicacion: cada lectura refleja el ultimo cambio confirmado.
    - Catalogo de categorias (`/publico/categorias`): 16 categorias con identificadores estables, publico y
      de solo lectura.
    - Registro de incidentes P4.1 (`/incidentes`): invitado (sin Authorization, telefono obligatorio, codigo
      de seguimiento mostrado una sola vez) o ciudadano con Bearer. `Idempotency-Key` UUID obligatoria. El
      backend resuelve el distrito y crea el incidente en REGISTRADO. El estado solo cambia por las rutas de
      atencion P6 (asumir, iniciar atencion y cerrar).
    - Atencion P6 (`/operador/incidentes/{id}/asumir|transiciones|verificacion`, `/admin/asignaciones`): una
      asignacion activa por incidente e institucion (unicidad en la BD); solo el responsable de la principal
      cambia el estado, verifica y cierra. Cada cambio guarda su historial en la misma transaccion. El
      administrador libera o reasigna con motivo sin acceso al caso. Mutaciones con cookie y origen web.
    - Seguimiento P4.1: `/ciudadano/incidentes` (Bearer de ciudadano, solo lo propio) y `/publico/seguimiento`
      (invitado con referencia y codigo en el cuerpo, limites por referencia e IP, 404 uniforme).
    - Territorio P3.1: catálogo y límites públicos, resolución de puntos sin sesión ni persistencia de
      coordenadas. Resolver solo por POST JSON (4 KiB), sin coordenadas en query, cuota de 60/IP/minuto
      por instancia. Todas sus respuestas no-store. Cambiar filtros/versiones no concede permisos.
      Métodos distintos de los declarados reciben 405 con Allow y ErrorTerritorialRespuesta.
      Valores/campos inválidos reciben 422; JSON mal formado recibe 400.
    - Las paginas de respaldo del enlace del correo (`GET /cuenta/restablecer`, `GET /cuenta/activar`) y
      `GET /.well-known/assetlinks.json` no son parte de esta API JSON; se describen en el README.
servers:
  - url: /api/v1
tags:
  - name: Acceso ciudadano
  - name: Recuperacion y activacion
  - name: Perfil
  - name: Contenido publico
  - name: Acceso institucional
  - name: Paneles
  - name: Territorio
  - name: Organizacion
  - name: Categorias
  - name: Incidentes
  - name: Seguimiento
  - name: Enrutamiento
  - name: Bandeja
  - name: Atencion
paths:
  /auth/ciudadanos/registro:
    post:
      tags: [Acceso ciudadano]
      operationId: registrarCiudadano
      summary: Crear una cuenta de ciudadano
      description: |
        Crea la cuenta con rol ciudadano y estado activo, fijados por el servidor. No inicia sesion
        ni exige verificar el correo. El correo se compara sin distinguir mayusculas.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistroSolicitud' }
      responses:
        '201':
          description: Cuenta creada. No incluye sesion, contrasena ni hash.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistroRespuesta' }
        '400': { $ref: '#/components/responses/ValidacionInvalida' }
        '409': { $ref: '#/components/responses/CorreoEnUso' }
        '413': { $ref: '#/components/responses/CuerpoDemasiadoGrande' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /auth/ciudadanos/sesiones:
    post:
      tags: [Acceso ciudadano]
      operationId: iniciarSesionCiudadano
      summary: Iniciar sesion con correo y contrasena
      description: |
        Emite una sesion opaca de 24 horas solo tras validar credenciales y persistirla. Correo
        desconocido, contrasena incorrecta, cuenta suspendida o no ciudadana producen el mismo 401.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginSolicitud' }
      responses:
        '200':
          description: Sesion iniciada.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginRespuesta' }
        '400': { $ref: '#/components/responses/ValidacionInvalida' }
        '401': { $ref: '#/components/responses/CredencialesInvalidas' }
        '413': { $ref: '#/components/responses/CuerpoDemasiadoGrande' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /auth/sesion:
    get:
      tags: [Acceso ciudadano]
      operationId: consultarSesion
      summary: Consultar la sesion actual
      description: |
        Devuelve unicamente la identidad del propietario de la sesion presentada. No acepta
        parametros para elegir otro usuario.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sesion vigente.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionRespuesta' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
    delete:
      tags: [Acceso ciudadano]
      operationId: cerrarSesion
      summary: Cerrar la sesion actual
      description: |
        Revoca solo la sesion presentada. Es idempotente: token ausente, desconocido o ya revocado
        tambien responde 204 sin afectar otras sesiones.
      security:
        - bearerAuth: []
        - {}
      responses:
        '204':
          description: Sesion revocada o inexistente.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /auth/recuperaciones:
    post:
      tags: [Recuperacion y activacion]
      operationId: solicitarRecuperacion
      summary: Solicitar el enlace para restablecer la contrasena
      description: |
        Respuesta uniforme: es la misma 202 exista o no la cuenta, este suspendida, pendiente o no
        sea ciudadana. Solo una cuenta ciudadana activa recibe un correo, que se envia despues de
        responder (el estado del proveedor no cambia la respuesta). Un 503 con Retry-After indica
        que se agoto el tope diario global de correos, con independencia de la cuenta.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecuperacionSolicitud' }
      responses:
        '202':
          description: Solicitud recibida. No confirma que exista una cuenta.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecuperacionRespuesta' }
        '400': { $ref: '#/components/responses/ValidacionInvalida' }
        '413': { $ref: '#/components/responses/CuerpoDemasiadoGrande' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponibleConCuota' }
  /auth/tokens/consulta:
    post:
      tags: [Recuperacion y activacion]
      operationId: consultarToken
      summary: Consultar el estado de un enlace sin consumirlo
      description: |
        Indica si el token es vigente y para que sirve. No lo modifica. Se usa para mostrar las
        pantallas de enlace usado o vencido antes de pedir una contrasena. El token viaja solo en
        el cuerpo, nunca en la URL.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenSolicitud' }
      responses:
        '200':
          description: Token vigente.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsultaTokenRespuesta' }
        '400': { $ref: '#/components/responses/ValidacionInvalida' }
        '404': { $ref: '#/components/responses/TokenInvalido' }
        '410': { $ref: '#/components/responses/TokenNoVigente' }
        '413': { $ref: '#/components/responses/CuerpoDemasiadoGrande' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /auth/contrasena/restablecer:
    post:
      tags: [Recuperacion y activacion]
      operationId: restablecerContrasena
      summary: Cambiar la contrasena con un token de recuperacion
      description: |
        Consumo atomico y de un solo uso: de varias solicitudes simultaneas con el mismo token solo
        una responde 204. En la misma operacion se invalidan los demas tokens de la cuenta y se
        revocan todas sus sesiones. No inicia sesion ni devuelve token de sesion. Un 400 por
        contrasena no admitida no consume el token. Un token de otro proposito, o de una cuenta que
        ya no puede usarlo, es 404 sin distinguir la causa.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsumoTokenSolicitud' }
      responses:
        '204':
          description: Contrasena cambiada y sesiones revocadas. Sin cuerpo.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '400': { $ref: '#/components/responses/ValidacionInvalida' }
        '404': { $ref: '#/components/responses/TokenInvalido' }
        '410': { $ref: '#/components/responses/TokenNoVigente' }
        '413': { $ref: '#/components/responses/CuerpoDemasiadoGrande' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /auth/activaciones:
    post:
      tags: [Recuperacion y activacion]
      operationId: activarCuenta
      summary: Activar una cuenta invitada y definir su contrasena
      description: |
        Para cuentas en estado `pendiente_activacion` invitadas por otra entrega (por ejemplo, el
        alta de operadores). Deja la cuenta activa con la contrasena elegida y no crea sesion. Esta
        entrega no expone ninguna ruta que cree operadores.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsumoTokenSolicitud' }
      responses:
        '204':
          description: Cuenta activada. Sin cuerpo y sin sesion.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '400': { $ref: '#/components/responses/ValidacionInvalida' }
        '404': { $ref: '#/components/responses/TokenInvalido' }
        '410': { $ref: '#/components/responses/TokenNoVigente' }
        '413': { $ref: '#/components/responses/CuerpoDemasiadoGrande' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /perfil:
    get:
      tags: [Perfil]
      operationId: obtenerPerfil
      summary: Consultar el perfil propio
      description: |
        Devuelve unicamente el perfil del titular de la sesion presentada. No acepta parametros para
        elegir otro usuario. Incluye el telefono (o nulo) y si autoriza compartirlo.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil del titular.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Perfil' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
    patch:
      tags: [Perfil]
      operationId: actualizarPerfil
      summary: Editar nombre, telefono y autorizacion de compartirlo
      description: |
        Aplica solo los campos enviados (al menos uno). El correo no es editable: enviar `correo`, `id`,
        `rol`, `estado` u otro campo no declarado devuelve 400. El telefono se normaliza (sin espacios,
        guiones, puntos ni parentesis; 7 a 15 digitos con `+` inicial opcional); `null` o texto vacio lo borra.
        La autorizacion exige telefono, se revoca al borrarlo o cambiarlo (salvo que la misma solicitud la
        otorgue) y revocarla no borra el numero. Ediciones simultaneas se serializan (ultima escritura).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PerfilCambios' }
      responses:
        '200':
          description: Perfil actualizado.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Perfil' }
        '400': { $ref: '#/components/responses/ValidacionInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '413': { $ref: '#/components/responses/CuerpoDemasiadoGrande' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /auth/institucional/sesiones:
    post:
      tags: [Acceso institucional]
      operationId: iniciarSesionInstitucional
      summary: Iniciar sesion de administrador u operador
      description: |
        Solo cuentas activas de rol administrador u operador. Ciudadano, cuenta suspendida, pendiente de
        activacion, correo desconocido y contrasena incorrecta producen el mismo 401. La sesion se
        entrega en una cookie HttpOnly; el cuerpo no incluye el token. Exige `Origin` igual al origen web.
      security: []
      parameters:
        - $ref: '#/components/parameters/OrigenWeb'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginSolicitud' }
      responses:
        '200':
          description: Sesion iniciada.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Set-Cookie: { $ref: '#/components/headers/SetCookieSesion' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionInstitucionalRespuesta' }
        '400': { $ref: '#/components/responses/ValidacionInvalida' }
        '401': { $ref: '#/components/responses/CredencialesInvalidas' }
        '403': { $ref: '#/components/responses/OrigenNoPermitido' }
        '413': { $ref: '#/components/responses/CuerpoDemasiadoGrande' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /auth/institucional/sesion:
    get:
      tags: [Acceso institucional]
      operationId: consultarSesionInstitucional
      summary: Consultar la sesion institucional (restaurar al refrescar)
      description: |
        Identidad y vencimiento de la sesion de la cookie. Cada peticion revalida el estado y el rol de la
        cuenta: una cuenta suspendida o que ya no es institucional recibe 401 aunque la sesion no haya vencido.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Sesion vigente.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionInstitucionalRespuesta' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
    delete:
      tags: [Acceso institucional]
      operationId: cerrarSesionInstitucional
      summary: Cerrar la sesion institucional
      description: |
        Revoca la sesion de la cookie y la borra. Idempotente: sin cookie, desconocida o ya revocada tambien
        responde 204. Exige `Origin` igual al origen web; si la solicitud declara contenido, debe ser JSON.
      security:
        - cookieAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/OrigenWeb'
      responses:
        '204':
          description: Sesion revocada o inexistente; la cookie queda borrada.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Set-Cookie: { $ref: '#/components/headers/SetCookieBorrada' }
        '403': { $ref: '#/components/responses/OrigenNoPermitido' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /administrador/panel:
    get:
      tags: [Paneles]
      operationId: obtenerPanelAdministrador
      summary: Panel minimo del administrador
      description: |
        Solo administradores activos. Devuelve la identidad y las secciones del panel segun la guia de UI
        (Inicio, Instituciones y sedes, Operadores, Coberturas, Categorias, Reglas, Contenido y contactos,
        Historial). Solo Instituciones y sedes, Operadores y Coberturas son `disponible: true` (P3.2); las demas
        siguen en false mientras no existan. Sin datos operativos ni metricas.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Panel del administrador.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PanelRespuesta' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RolNoPermitido' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /operador/panel:
    get:
      tags: [Paneles]
      operationId: obtenerPanelOperador
      summary: Panel minimo del operador
      description: |
        Solo operadores activos. Devuelve la identidad y las secciones del panel (Inicio, Incidentes, Mapa,
        Indicadores, Historial), todas `disponible: false` mientras no existan. Sin datos operativos ni metricas.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Panel del operador.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PanelRespuesta' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RolNoPermitido' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /administrador/organizacion/instituciones:
    get:
      tags: [Organizacion]
      operationId: listarInstituciones
      summary: Listar las cuatro instituciones
      description: |
        Catalogo cerrado: PNP, Bomberos, SAMU y Serenazgo (una por tipo, sembradas por la migracion). No existe
        ruta para crear instituciones; otros metodos reciben 405 con `Allow`. Solo administradores activos.
      security:
