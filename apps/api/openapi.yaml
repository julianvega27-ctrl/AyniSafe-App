      operationId: listarSedes
      summary: Listar sedes con cobertura y competencias
      description: |
        Todas las sedes, con verificacion documental, habilitacion para atencion, estado, marca de demostracion,
        distritos de cobertura y categorias de competencia. La ubicacion no implica cobertura.
