      operationId: listarOperadoresSede
      summary: Listar los operadores de una sede
      description: |
        Nombre, correo, estado (pendiente_activacion, activo o suspendido) y marca de demostracion.
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, description: 'Identificador (UUID) de la sede. Un valor que no es UUID o no existe responde 404.', schema: { type: string } }
      responses:
        '200':
          description: Operadores de la sede.
          headers:
