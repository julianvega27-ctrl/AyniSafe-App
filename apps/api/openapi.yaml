      operationId: reemplazarCompetencias
      summary: Reemplazar las categorias de competencia
      description: |
        Conjunto completo de categorias activas del catalogo. Una categoria desconocida responde 400 sin cambios.
        Vaciarlo en una sede habilitada responde 409 `SEDE_HABILITADA`.
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, description: 'Identificador (UUID) de la sede. Un valor que no es UUID o no existe responde 404.', schema: { type: string } }
