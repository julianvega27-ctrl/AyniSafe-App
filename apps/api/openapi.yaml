        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RolNoPermitido' }
        '404': { $ref: '#/components/responses/RecursoNoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
    post:
      tags: [Organizacion]
      operationId: agregarOperador
      summary: Agregar un operador a una sede
      description: |
        Crea la cuenta pendiente de activacion, su pertenencia a esta unica sede y la invitacion en la misma
        transaccion. Sin contrasena: el titular la elige con el enlace de activacion.
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, description: 'Identificador (UUID) de la sede. Un valor que no es UUID o no existe responde 404.', schema: { type: string } }
        - $ref: '#/components/parameters/OrigenWeb'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperadorAlta' }
      responses:
        '201':
          description: Operador creado e invitado.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperadorRespuesta' }
        '400': { $ref: '#/components/responses/ValidacionInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ProhibidoOrganizacion' }
        '404': { $ref: '#/components/responses/RecursoNoEncontrado' }
        '409': { $ref: '#/components/responses/ConflictoOrganizacion' }
        '413': { $ref: '#/components/responses/CuerpoDemasiadoGrande' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /administrador/organizacion/operadores/{id}:
    patch:
      tags: [Organizacion]
      operationId: cambiarEstadoOperador
      summary: Suspender o reactivar un operador
      description: |
        Suspender revoca sus sesiones y sus enlaces de activacion sin usar en la misma transaccion; dejar sin
        operador activo una sede habilitada responde 409 `ULTIMO_OPERADOR_ACTIVO`. Reactivar devuelve la cuenta a
        activa o, si nunca se activo, a pendiente (hace falta reenviar la invitacion). No borra filas.
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, description: 'Identificador (UUID) del operador. Una cuenta que no es operador con sede responde 404.', schema: { type: string } }
        - $ref: '#/components/parameters/OrigenWeb'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperadorCambio' }
      responses:
        '200':
          description: Estado del operador.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperadorRespuesta' }
        '400': { $ref: '#/components/responses/ValidacionInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ProhibidoOrganizacion' }
        '404': { $ref: '#/components/responses/RecursoNoEncontrado' }
        '409': { $ref: '#/components/responses/ConflictoOrganizacion' }
        '413': { $ref: '#/components/responses/CuerpoDemasiadoGrande' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /administrador/organizacion/operadores/{id}/invitacion:
    post:
      tags: [Organizacion]
      operationId: reenviarInvitacion
      summary: Reenviar la invitacion de un operador pendiente
      description: |
        Invalida los enlaces de activacion anteriores sin usar y encola un correo nuevo (sin duplicar un envio
        activo). Una cuenta activa o suspendida responde 409 `INVITACION_NO_APLICABLE`. Nunca devuelve el enlace.
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, description: 'Identificador (UUID) del operador. Una cuenta que no es operador con sede responde 404.', schema: { type: string } }
        - $ref: '#/components/parameters/OrigenWeb'
      responses:
        '202':
          description: Invitacion encolada.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitacionRespuesta' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ProhibidoOrganizacion' }
        '404': { $ref: '#/components/responses/RecursoNoEncontrado' }
        '409': { $ref: '#/components/responses/ConflictoOrganizacion' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /operador/ambito:
    get:
      tags: [Paneles]
      operationId: consultarAmbitoOperador
      summary: Ambito del propio operador
      description: |
        Institucion, sede, distritos de cobertura, categorias y habilitacion de la sede del titular de la sesion.
        `ambito: null` si la sede o la institucion no estan activas. Sin datos de otras sedes ni operadores.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Ambito vigente.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AmbitoRespuesta' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RolNoPermitido' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /publico/contenido:
    get:
      tags: [Contenido publico]
      operationId: obtenerContenidoPublico
      summary: Contenido publico versionado (sin sesion)
      description: |
        Finalidad y funcionamiento, desarrolladores, privacidad y contactos de emergencia. Es el mismo
        contenido para todos. Una seccion `pendiente` no lleva texto. No incluye datos de cuentas. Los
        metodos distintos de GET responden 405 con `Allow`.
      security: []
      responses:
        '200':
          description: Contenido vigente.
          headers:
            Cache-Control:
              description: Cache publica breve.
              schema: { type: string, const: "public, max-age=300" }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContenidoPublico' }
  /publico/territorio/distritos:
    get:
      tags: [Territorio]
      operationId: listarDistritosPiloto
      summary: Cinco distritos y estado del catálogo territorial
      description: Sin sesión; no admite parámetros. Sin cartografía activa entrega versión y UBIGEO nulos.
      security: []
      responses:
        '200':
          description: Catálogo disponible o pendiente.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogoTerritorial' }
              example: { estado: pendiente, version: null, distritos: [{ id: DIS-01, nombre: Ayacucho, ubigeo: null }, { id: DIS-02, nombre: San Juan Bautista, ubigeo: null }, { id: DIS-03, nombre: Carmen Alto, ubigeo: null }, { id: DIS-04, nombre: Jesús Nazareno, ubigeo: null }, { id: DIS-05, nombre: Andrés Avelino Cáceres Dorregaray, ubigeo: null }] }
        '422': { $ref: '#/components/responses/ErrorConsultaTerritorial' }
        '503': { $ref: '#/components/responses/ErrorConsultaTerritorial' }
  /publico/territorio/limites:
    get:
      tags: [Territorio]
      operationId: obtenerLimitesDistritales
      summary: Cartografía de referencia de una única versión
      description: Sin versión explícita usa la activa; sin activa responde 503. Una versión explícita ausente recibe 404 y nunca se sustituye por la activa. Admite HEAD.
      security: []
      parameters:
        - in: query
          name: version
          required: false
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '200':
          description: FeatureCollection WGS84 de cinco distritos. No representa delimitación legal ni cobertura institucional.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LimitesTerritoriales' }
        '404': { $ref: '#/components/responses/ErrorConsultaTerritorial' }
        '422': { $ref: '#/components/responses/ErrorConsultaTerritorial' }
        '503': { $ref: '#/components/responses/ErrorConsultaTerritorial' }
  /publico/territorio/resolver:
    post:
      tags: [Territorio]
      operationId: resolverDistritoDelPunto
      summary: Resolver un punto sin guardar su ubicación
      description: |
        Solo interiores inequívocos. Borde tiene precedencia sobre solapamiento; huecos se excluyen.
        Fuera del área es un resultado pendiente, distinto de cartografía no disponible. No recibe
        coordenadas por query ni concede permisos. Cuota 60/IP/minuto por instancia; 4 KiB JSON.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PuntoTerritorial' }
            example: { latitud: -13.158, longitud: -74.224 }
      responses:
        '200':
          description: Resultado con la versión efectivamente evaluada.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoTerritorial' }
              example: { estado: pendiente, distrito: null, motivo: fuera_area, version: '5cb61fbee9a0e8b24fc33c3ddc346864479b9b01d685901c36dafca130fe8067' }
        '400': { $ref: '#/components/responses/ErrorConsultaTerritorial' }
        '404': { $ref: '#/components/responses/ErrorConsultaTerritorial' }
        '413': { $ref: '#/components/responses/ErrorConsultaTerritorial' }
        '415': { $ref: '#/components/responses/ErrorConsultaTerritorial' }
        '422': { $ref: '#/components/responses/ErrorConsultaTerritorial' }
        '429':
          description: Cuota por IP o capacidad de claves agotada; no se clasifica el punto.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorTerritorialRespuesta' }
        '503': { $ref: '#/components/responses/ErrorConsultaTerritorial' }
  /publico/categorias:
    get:
      tags: [Categorias]
      operationId: listarCategorias
      summary: Catalogo de las 16 categorias (sin sesion)
      description: |
        Mismo cuerpo para anonimos y para los tres roles. Solo identificador estable, nombre, orden y estado
        activo; sin prioridades, reglas ni destinatarios. Sin parametros. Otros metodos reciben 405 con `Allow`.
      security: []
      responses:
        '200':
          description: Catalogo vigente.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogoCategorias' }
        '400': { $ref: '#/components/responses/ErrorCatalogo' }
        '503': { $ref: '#/components/responses/ErrorCatalogo' }
  /incidentes:
    post:
      tags: [Incidentes]
      operationId: registrarIncidente
      summary: Registrar un incidente como invitado o con cuenta ciudadana
      description: |
        Cada envio confirmado crea un incidente unico en estado REGISTRADO (P4.1). Sin `Authorization` se
        registra como invitado: el telefono de contacto es obligatorio y la respuesta incluye una unica vez
        el codigo secreto de seguimiento (el servidor solo guarda su huella). Con `Authorization: Bearer` de
        un ciudadano activo, el autor sale de la sesion y no se admite telefono. Un `Authorization` invalido
        responde 401 (no se degrada a invitado) y una sesion institucional por cookie responde 403.

        El backend resuelve el distrito desde el punto con la version territorial activa; frontera,
        solapamiento o punto fuera del area quedan pendientes con su motivo, y sin cartografia activa se
        registra igual con motivo `sin_cartografia`. `Idempotency-Key` (UUID) es obligatoria: repetirla con el
        mismo contenido devuelve 200 con el mismo incidente (el invitado recibe un codigo nuevo que invalida el
        anterior); con otro contenido, 409. El registro no espera enrutamiento ni avisos: se publica el evento
        `IncidenteRegistrado` en la misma transaccion. Invitados: 10 envios por IP y hora (configurable); una
        repeticion no consume el limite. JSON de hasta 8 KiB; campos no declarados reciben 400.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnvioIncidente' }
            examples:
              invitado:
                value:
                  categoriaId: pelea
                  descripcion: Pelea entre varias personas frente al mercado
                  ocurrencia: { modo: ahora, instante: '2026-11-26T10:00:00-05:00' }
                  punto: { latitud: -13.1588, longitud: -74.2232, origen: gps, precisionM: 12 }
                  heridos: no_se
                  telefonoContacto: '+51987654321'
      responses:
        '201':
          description: Incidente registrado. El codigo de seguimiento solo aparece en envios de invitado.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComprobanteIncidente' }
              example:
                referencia: INC-7K3M9-Q2TXA
                estado: REGISTRADO
                recibidoEn: '2026-11-26T15:00:01.123Z'
                modalidad: invitado
                territorio: { estado: resuelto, distrito: { id: DIS-01, nombre: Ayacucho } }
                codigoSeguimiento: 7K3M-9Q2T-XAB4-CD5E
                permisoEvidencias: { valor: q3Vb8kQ0mZt1Xx9JcN2pLr4sW6yUe7Ai5Hd0Gf3Kj1M, venceEn: '2026-11-27T15:00:01.123Z' }
        '200':
          description: Repeticion idempotente del mismo envio. Mismo incidente; el invitado recibe un codigo nuevo.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComprobanteIncidente' }
        '400':
          description: |
            `VALIDATION_ERROR` (campos ausentes, invalidos, reservados o no aplicables a la categoria o modalidad;
            JSON mal formado) o `IDEMPOTENCY_KEY_REQUIRED` (cabecera ausente o que no es un UUID).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: Sesion institucional (operador o administrador) vigente por cookie. Las cuentas institucionales no registran incidentes.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: IDEMPOTENCY_CONFLICT, la clave ya se uso con otro contenido. No se modifica el incidente existente.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/CuerpoDemasiadoGrande' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '503':
          description: Base de datos, catalogo o cartografia no legibles. No queda incidente parcial; reintentar con la misma clave no duplica.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /incidentes/{referencia}/evidencias:
    post:
      tags: [Incidentes]
      operationId: adjuntarEvidencia
      summary: Adjuntar una fotografia a un incidente ya registrado (P5.2)
      description: |
        Una foto por solicitud en el campo `foto` (multipart). Con cuenta, mediante la sesion Bearer del autor;
        como invitado, con el permiso de carga del comprobante en `X-Permiso-Evidencias`. Solo durante las 24 h
        siguientes a la recepcion y con el incidente abierto. Maximo 3 fotos de hasta 5 MB, JPEG, PNG o WebP
        segun su contenido real; la API guarda una copia re-codificada sin EXIF ni GPS (no es un original
        forense). Un fallo o rechazo nunca afecta al incidente registrado. La respuesta no incluye URLs ni
        identificadores del proveedor.
      security: [{ bearerAuth: [] }, { permisoEvidencias: [] }]
      parameters:
        - name: referencia
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [foto]
              properties:
                foto: { type: string, format: binary, description: 'Una sola imagen de hasta 5 MB.' }
      responses:
        '201':
          description: Fotografia adjuntada.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenciaVista' }
        '200':
          description: Repeticion con la misma clave y el mismo archivo; misma evidencia.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenciaVista' }
        '400':
          description: Falta Idempotency-Key, falta el campo foto o hay mas de un archivo.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Sin sesion ni permiso de carga, o sesion invalida.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 'Sesion institucional; los operadores y administradores no adjuntan fotos.'
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Incidente inexistente, ajeno, fuera de plazo o cerrado, o permiso invalido o vencido. Mismo cuerpo en todos los casos.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Clave reutilizada con otro archivo (IDEMPOTENCY_CONFLICT) o ya hay 3 fotos (EVIDENCE_LIMIT).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: La fotografia supera 5 MB.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: El cuerpo no es multipart/form-data.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: El archivo no es una fotografia JPEG, PNG o WebP valida (INVALID_IMAGE).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Demasiadas cargas de invitado desde el mismo origen.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Almacen deshabilitado, sin cuota o no disponible (EVIDENCE_STORAGE_UNAVAILABLE). El reporte sigue registrado; reintentable con la misma clave.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /ciudadano/incidentes:
    get:
      tags: [Seguimiento]
      operationId: listarMisIncidentes
      summary: Historial privado de los incidentes registrados con la propia cuenta
      description: |
        Solo los incidentes de modalidad cuenta del titular del Bearer, del mas reciente al mas antiguo
        (desempate por identificador), en paginas de 20. `siguiente` es un cursor opaco; nulo en la ultima pagina.
        No incluye envios de invitado ni de otros autores. Unico parametro admitido: `cursor`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Pagina del historial propio (puede estar vacia).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistorialIncidentes' }
        '400':
          description: Cursor manipulado o parametros no admitidos.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: Sesion institucional por cookie. Solo el ciudadano autor consulta su historial.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /ciudadano/incidentes/{referencia}:
    get:
      tags: [Seguimiento]
      operationId: consultarMiIncidente
      summary: Detalle privado de un incidente propio
      description: |
        Datos originales del autor, estado, territorio, respuestas para SAMU y su evaluacion propia (P5.1, sin
        cambios ni motivos de operadores). La institucion responsable es
        la principal con participacion (P4.2), sin sede ni operadores, o pendiente si falta; las actuaciones
        se informan pendientes hasta la atencion (P6). Un incidente ajeno, de invitado o inexistente responde
        el mismo 404, sin revelar si existe.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: referencia
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
      responses:
        '200':
          description: Detalle del incidente propio.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetalleIncidenteAutor' }
        '400':
          description: Parametros de consulta no admitidos.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: Sesion institucional por cookie.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/SeguimientoNoEncontrado' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /ciudadano/incidentes/{referencia}/evidencias/{evidenciaId}/contenido:
    get:
      tags: [Seguimiento]
      operationId: obtenerMiEvidencia
      summary: Contenido de una foto propia (P5.2)
      description: |
        Solo el ciudadano autor con cuenta. Se entrega a traves de la API, sin redirigir al proveedor ni
        exponer URLs firmadas; cada entrega queda registrada sin contenido. Una foto ajena, inexistente o no
        disponible responde el mismo 404. El codigo secreto y el permiso de carga del invitado no dan acceso.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: referencia, in: path, required: true, schema: { type: string, maxLength: 40 } }
        - { name: evidenciaId, in: path, required: true, schema: { type: string, maxLength: 64 } }
      responses:
        '200':
          description: Imagen con su tipo real, inline, nosniff y CSP sandbox.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '400':
          description: Parametros de consulta no admitidos.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: Sesion institucional por cookie.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/SeguimientoNoEncontrado' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /ciudadano/incidentes/{referencia}/evaluacion:
    post:
      tags: [Seguimiento]
      operationId: aclararMiEvaluacion
      summary: Completar o corregir la evaluacion rapida propia
      description: |
        Solo el autor con cuenta, mientras el incidente no este cerrado (P5.1). Crea una version de origen
        ciudadano con los campos que cambian; si coinciden con la vigente no crea version (reintento seguro).
        Si la condicion activa a SAMU, el enrutamiento se recalcula en la misma transaccion. Un incidente ajeno,
        de invitado, inexistente o sin evaluacion responde el mismo 404. JSON de hasta 8 KiB.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: referencia
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AclaracionEvaluacion' }
            example: { heridos: si, cantidadHeridos: 2 }
      responses:
        '200':
          description: Respuestas propias vigentes tras la aclaracion.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [evaluacion]
                properties:
                  evaluacion: { $ref: '#/components/schemas/VistaEvaluacionAutor' }
        '400':
          description: VALIDATION_ERROR con los campos invalidos, no aplicables o un cuerpo vacio.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: Sesion institucional por cookie.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: NOT_FOUND, uniforme para ajeno, de invitado, inexistente o sin evaluacion.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: EVALUACION_CERRADA, el incidente esta cerrado.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Almacenamiento o recalculo no disponible; nada se confirmo y reintentar no duplica.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /publico/seguimiento:
    post:
      tags: [Seguimiento]
      operationId: consultarSeguimientoInvitado
      summary: Vista limitada del invitado con referencia y codigo secreto
      description: |
        Sin sesion. Referencia y codigo viajan solo en el cuerpo: una solicitud con parametros en la URL se
        rechaza sin consultar. Devuelve solo estado y resumen ciudadano; nunca descripcion, punto, distrito,
        telefono, evidencias ni respuestas sanitarias. Referencia inexistente, codigo incorrecto o reemplazado e
        incidente de cuenta responden el mismo 404. Limites: 10 intentos por referencia en 15 min y 30 por IP
        en una hora (configurables), contados antes de verificar el codigo.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsultaSeguimiento' }
            example: { referencia: INC-7K3M9-Q2TXA, codigo: 7K3M-9Q2T-XAB4-CD5E }
      responses:
        '200':
          description: Estado y resumen ciudadano del incidente.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VistaSeguimientoInvitado' }
        '400':
          description: Cuerpo invalido o parametros en la URL.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/SeguimientoNoEncontrado' }
        '413': { $ref: '#/components/responses/CuerpoDemasiadoGrande' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /operador/incidentes:
    get:
      tags: [Bandeja]
      operationId: listarBandejaOperador
      summary: Bandeja FIFO de los incidentes en que participa la sede del operador
      description: |
        Solo lectura (P4.2). Incidentes con participacion de la sede del operador dentro de su ambito vigente
        (distrito y categoria del enrutamiento cubiertos por la sede; las participaciones designadas por el
        administrador son excepcion limitada al caso). Orden de llegada, del mas antiguo al mas reciente, con
        desempate por identificador, en paginas de 50. La prioridad (P6) no reordena.
        Sin telefono, coordenadas, codigo, autor, otras sedes ni operadores. Parametros admitidos: `cursor` y `responsable`.
      security: [{ cookieAuth: [] }]
      parameters:
        - name: responsable
          in: query
          required: false
          description: P6. `sin_tomar`, casos abiertos de tu institucion sin responsable activo; `mios`, casos que tienes asignados. No cambia el orden FIFO.
          schema: { type: string, enum: [sin_tomar, mios] }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Pagina de la bandeja (puede estar vacia).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BandejaOperador' }
        '400': { $ref: '#/components/responses/ConsultaBandejaInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ProhibidoBandeja' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /operador/incidentes/{id}:
    get:
      tags: [Bandeja]
      operationId: consultarResumenOperador
      summary: Resumen limitado de un incidente de la bandeja
      description: |
        Campos de la fila mas descripcion, ocurrencia, resultado territorial, respuestas de heridos y atencion
        medica informadas por el ciudadano, condicion medica vigente (resumen de heridos, P5.1), si el operador
        tiene acceso al detalle sanitario, tipos de las demas instituciones participantes y metadatos de las fotos
        disponibles (P5.2). Sin telefono, coordenadas, codigo, autor, contenido ni URLs de fotos, ni observaciones
        de la persona principal. Un incidente fuera del ambito,
        inexistente o con identificador malformado responde el mismo 404.
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Resumen del incidente.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumenIncidenteOperador' }
        '400': { $ref: '#/components/responses/ConsultaBandejaInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ProhibidoBandeja' }
        '404': { $ref: '#/components/responses/IncidenteNoDisponible' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /operador/incidentes/{id}/evidencias/{evidenciaId}/contenido:
    get:
      tags: [Bandeja]
      operationId: obtenerEvidenciaOperador
      summary: Contenido de una foto para un operador participante (P5.2)
      description: |
        Cualquier operador cuya sede participa en el incidente dentro de su ambito vigente. Se entrega a
        traves de la API, sin redirigir al proveedor ni exponer URLs firmadas; cada entrega queda registrada
        sin contenido. Lo ajeno, inexistente, malformado o no disponible responde el mismo 404.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } }
        - { name: evidenciaId, in: path, required: true, schema: { type: string, maxLength: 64 } }
      responses:
        '200':
          description: Imagen con su tipo real, inline, nosniff y CSP sandbox.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/ConsultaBandejaInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ProhibidoBandeja' }
        '404': { $ref: '#/components/responses/IncidenteNoDisponible' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /operador/incidentes/{id}/evaluacion:
    get:
      tags: [Bandeja]
      operationId: consultarEvaluacionSanitaria
      summary: Detalle sanitario de la evaluacion para el operador SAMU participante
      description: |
        Evaluacion vigente e historial de versiones (P5.1, RF43). Solo si la sede del operador es SAMU y
        participa en el incidente dentro de su ambito vigente; otra institucion, una sede SAMU sin participacion,
        un identificador inexistente o malformado y un incidente sin evaluacion responden el mismo 404. Cada
        lectura autorizada se registra (usuario, incidente, version e instante) sin copiar su contenido.
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Evaluacion vigente e historial.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetalleSanitario' }
        '400': { $ref: '#/components/responses/ConsultaBandejaInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ProhibidoBandeja' }
        '404': { $ref: '#/components/responses/IncidenteNoDisponible' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
    post:
      tags: [Bandeja]
      operationId: precisarCondicionMedica
      summary: Precisar la condicion medica o aclarar la evaluacion
      description: |
        Un operador cuya sede participa dentro de su ambito vigente precisa heridos, atencion medica y cantidad
        con un motivo; solo el operador SAMU envia observaciones de la persona principal (P5.1). Crea una version
        de origen operador; si coincide con la vigente no crea version. Si la condicion activa a SAMU, en la misma
        transaccion SAMU se incorpora (principal en accidente, con PNP simultanea; condicionada en agresion, pelea
        o violencia) o queda como faltante. Nunca retira participaciones. Exige el origen web (CSRF). La respuesta
        solo lleva el resumen de heridos. JSON de hasta 4 KiB.
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AclaracionEvaluacionOperador' }
            example: { heridos: si, motivo: Confirmado por llamada al lugar }
      responses:
        '200':
          description: Version vigente tras la precision.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoAclaracionOperador' }
        '400':
          description: VALIDATION_ERROR con los campos invalidos (incluidas observaciones de una institucion que no es SAMU).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: FORBIDDEN (no es operador), FORBIDDEN_ORIGIN (origen web no permitido) o SIN_AMBITO.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/IncidenteNoDisponible' }
        '409':
          description: EVALUACION_CERRADA, el incidente esta cerrado.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415': { $ref: '#/components/responses/TipoNoSoportado' }
        '503':
          description: Almacenamiento o recalculo no disponible; nada se confirmo y reintentar no duplica.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /operador/incidentes/{id}/asumir:
    post:
      tags: [Atencion]
      operationId: asumirCaso
      summary: Asumir la participacion de la institucion del operador
      description: |
        Una asignacion activa por incidente e institucion (EQ-20): el segundo operador recibe 409 CASO_ASUMIDO y repetir
        devuelve 200 con la misma asignacion. La primera asuncion de la principal pasa REGISTRADO a EN_REVISION en la
        misma transaccion; nunca pasa a EN_ATENCION. Sin cuerpo.
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrigenWeb'
