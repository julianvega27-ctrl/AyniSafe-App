<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 1640" width="1660" height="1640" role="img" aria-labelledby="title desc">
<title id="title">AyniSafe · Diagrama UML de clases del módulo Reportes</title>
<desc id="desc">Once clases e interfaces del diseño de Reportes. El controlador usa el caso de uso, que crea Reporte y utiliza cuatro puertos. Reporte compone una ubicación opcional y varias referencias de evidencia. Los adaptadores Prisma y S3 realizan sus interfaces de Aplicación.</desc>
<defs>
  <marker id="open-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="var(--line)" stroke-width="1.8"/></marker>
  <marker id="triangle" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="17" markerHeight="17" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L15 8 L1 15 Z" fill="var(--paper)" stroke="var(--line)" stroke-width="1.8"/></marker>
  <marker id="diamond" viewBox="0 -7 20 14" refX="0" refY="0" markerWidth="20" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 -6 L18 0 L9 6 Z" fill="var(--line)"/></marker>
</defs>
<style>
