<rect class="note" x="40" y="1410" width="1570" height="190" rx="9"/>
<text x="62" y="1440" class="note-title" >Notación UML y alcance</text>
<text x="62" y="1472" class="note-text" >→ Asociación: referencia a un colaborador.   ⇢ Dependencia «crea».   △ Realización: línea discontinua y triángulo hueco.   ◆ Composición.</text>
<text x="62" y="1501" class="note-text" >0..1: ubicación opcional.   0..*: referencias de evidencia.   + público / - privado.   {static}: operación de clase.   Resultado: { reporteId, estado }.</text>
<text x="62" y="1530" class="note-text" >DatosReporte reúne id, autorId, categoriaId, descripcion, ocurridoEn, registradoEn, ubicacion y evidencias; EstadoReporte contiene REGISTRADO.</text>
<text x="62" y="1559" class="note-text" >La composición se expresa a través de DatosReporte. Las referencias pertenecen al reporte; el archivo físico en S3 tiene su propio ciclo de vida.</text>
</svg>